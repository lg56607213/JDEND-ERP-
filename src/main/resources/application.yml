server:
  port: 8080
  servlet:
    session:
      timeout: 120m

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

codef:
  client-id: a872e297-5b27-459d-9896-5e02f2cb1d41
  client-secret: 6e341ebb-de76-4af6-9093-be61e5dfc242
  public-key: 
  base-url: https://api.codef.io
  oauth-url: https://oauth.codef.io

app:
  contact:
    recipient-email: ${MAIL_USERNAME}
  upload-dir: uploads/accounts
  multidb:
    default-db: auth
    # 회사(테넌트)마다 별도 풀이 생기므로 HikariCP 기본값(최대 10, 유휴 10)을 쓰면
    # 회사 수 × 10 만큼 커넥션을 상시 점유해 MySQL max_connections에 금방 도달한다.
    pool:
      auth-max-size: 5
      auth-min-idle: 1
      tenant-max-size: 3
      tenant-min-idle: 0
      idle-timeout-ms: 60000
      connection-timeout-ms: 10000
      max-lifetime-ms: 1500000
    datasources:
      auth:
        url: ${DB_URL_AUTH}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
