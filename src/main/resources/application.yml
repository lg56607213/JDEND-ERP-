server:
  port: 8080
  servlet:
    session:
      timeout: 120m

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}
  base-url: https://api.codef.io
  oauth-url: https://oauth.codef.io

app:
  # 과태료 고지서 자동 인식(Claude API). 키는 서버 환경변수로만 넣는다.
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # 과태료 변경부과 신청 팩스(팝빌). 연동키는 서버 환경변수, 회사별 발신번호는 화면의 '팩스 발신 설정'.
  fax:
    popbill:
      link-id: ${POPBILL_LINK_ID:}
      secret-key: ${POPBILL_SECRET_KEY:}
      test: ${POPBILL_TEST:true}
  contact:
    recipient-email: ${MAIL_USERNAME}
  upload-dir: uploads/accounts
  # 첨부파일 저장소: local(서버 디스크) | s3
  # s3로 바꾸면 EC2 인스턴스 역할의 권한으로 접근한다. 문제가 생기면 local로 되돌리면 된다.
  storage:
    type: local
    local-root: uploads
    migrate-on-start: false
    s3:
      bucket: ""
      region: ap-northeast-2
      prefix: ""

  multidb:
    default-db: auth
    # 회사(테넌트)마다 별도 풀이 생기므로 HikariCP 기본값(최대 10, 유휴 10)을 쓰면
    # 회사 수 × 10 만큼 커넥션을 상시 점유해 MySQL max_connections에 금방 도달한다.
    pool:
      auth-max-size: 5
      auth-min-idle: 1
      tenant-max-size: 3
      tenant-min-idle: 0
      idle-timeout-ms: 60000
      connection-timeout-ms: 10000
      max-lifetime-ms: 1500000
    datasources:
      auth:
        url: ${DB_URL_AUTH}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
