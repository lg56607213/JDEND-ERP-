<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보증금/선수금관리 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .content-wrapper { margin-left: 220px; padding: 32px; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #1b253a; margin-bottom: 4px; }
    .page-sub { font-size: 0.88rem; color: #6b7280; margin-bottom: 24px; }

    /* 검색 */
    .search-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 24px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg label { font-size: 0.82rem; font-weight: 700; color: #374151; }
    .fg input, .fg select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.9rem; }
    .date-row { display: flex; align-items: center; gap: 6px; }
    .date-row input { width: 130px; }
    .date-sep { color: #9ca3af; }

    /* 버튼 */
    .btn { padding: 8px 18px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
    .btn-search  { background: #23304e; color: #fff; }
    .btn-search:hover  { background: #1b253a; }
    .btn-collect { background: #2563eb; color: #fff; }
    .btn-collect:hover { background: #1d4ed8; }
    .btn-refund  { background: #dc2626; color: #fff; }
    .btn-refund:hover  { background: #b91c1c; }
    .btn-history { background: #6b7280; color: #fff; }
    .btn-history:hover { background: #4b5563; }
    .btn-sm { padding: 5px 11px; font-size: 0.82rem; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }

    /* 목록 카드 */
    .list-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 20px 24px; overflow-x: auto; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .list-info { font-size: 0.88rem; color: #6b7280; }
    .list-info strong { color: #1b253a; }

    /* 테이블 */
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    thead tr { border-top: 2px solid #23304e; border-bottom: 2px solid #e5e7eb; }
    th { padding: 10px 10px; font-size: 0.82rem; font-weight: 700; color: #374151; background: #f8fafc; text-align: center; white-space: nowrap; }
    td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem; color: #374151; white-space: nowrap; }
    td.center { text-align: center; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: #f9fafb; }
    .empty { text-align: center; color: #9ca3af; padding: 48px 0; }

    /* 뱃지 */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
    .badge-deposit  { background: #ede9fe; color: #5b21b6; }
    .badge-advance  { background: #fef3c7; color: #92400e; }
    .balance-pos { color: #059669; font-weight: 700; }
    .balance-zero { color: #9ca3af; }

    /* 모달 공통 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 2000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 10px; padding: 28px; width: 500px; max-width: 96vw; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 18px; font-size: 1.08rem; color: #1b253a; font-weight: 700; }
    .mfg { margin-bottom: 14px; }
    .mfg label { display: block; font-size: 0.84rem; font-weight: 700; color: #374151; margin-bottom: 5px; }
    .mfg input, .mfg select, .mfg textarea { width: 100%; padding: 8px 11px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.93rem; box-sizing: border-box; }
    .mfg input[readonly] { background: #f8fafc; color: #6b7280; }
    .mfg textarea { resize: vertical; height: 70px; }
    .info-box { background: #f0f9ff; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
    .info-row { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #6b7280; }
    .info-val { font-weight: 700; color: #1b253a; }
    .radio-row { display: flex; gap: 20px; align-items: center; padding: 6px 0; }
    .radio-row label { font-size: 0.93rem; font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    /* 이력 모달 테이블 */
    .history-wrap { overflow-x: auto; }
    .history-wrap table { min-width: 560px; }

    /* 에러 메시지 */
    .err-msg { background: #fef2f2; color: #b91c1c; border-radius: 6px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 12px; display: none; }
    .err-msg.show { display: block; }

    @media(max-width:768px){
      .content-wrapper { margin-left: 0; padding: 16px; }
    }
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="content-wrapper">
  <h1>보증금/선수금관리</h1>
  <p class="page-sub">회계관리 &gt; 보증금/선수금관리 — 계약별 보증금·선수금 수납·반환 현황 및 거래 이력</p>

  <!-- 검색 영역 -->
  <div class="search-card">
    <div class="fg">
      <label>기간 (계약기간 기준)</label>
      <div class="date-row">
        <input type="date" id="startDate" placeholder="시작일">
        <span class="date-sep">~</span>
        <input type="date" id="endDate" placeholder="종료일">
      </div>
    </div>
    <div class="fg">
      <label>유형</label>
      <select id="filterType">
        <option value="">전체</option>
        <option value="보증금">보증금</option>
        <option value="선수금">선수금</option>
      </select>
    </div>
    <div class="fg">
      <label>고객명</label>
      <input type="text" id="filterCustomer" placeholder="고객명 검색" style="width:150px;">
    </div>
    <button class="btn btn-search" onclick="loadList()">조회</button>
  </div>

  <!-- 목록 -->
  <div class="list-card">
    <div class="list-header">
      <span class="list-info">총 <strong id="totalCount">0</strong>건</span>
    </div>
    <table id="mainTable">
      <thead>
        <tr>
          <th>계약번호</th>
          <th>고객명</th>
          <th>차량번호</th>
          <th>유형</th>
          <th>계약보증금</th>
          <th>총수납액</th>
          <th>총지급액</th>
          <th>보증금잔액</th>
          <th>계약시작일</th>
          <th>계약종료일</th>
          <th>최근거래일</th>
          <th>이력</th>
          <th>수납</th>
          <th>지급</th>
        </tr>
      </thead>
      <tbody id="mainTbody">
        <tr><td colspan="14" class="empty">조회 버튼을 눌러 데이터를 불러오세요.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 거래이력 모달 -->
<div class="modal-overlay" id="historyModal">
  <div class="modal" style="width:660px;">
    <h3 id="historyTitle">거래 이력</h3>
    <div class="info-box" id="historyInfo"></div>
    <div class="history-wrap">
      <table>
        <thead>
          <tr style="border-top:2px solid #23304e;border-bottom:2px solid #e5e7eb;">
            <th>거래일자</th><th>유형</th><th>금액</th><th>누적잔액</th><th>메모</th><th>전표</th>
          </tr>
        </thead>
        <tbody id="historyTbody">
          <tr><td colspan="6" class="empty">이력 없음</td></tr>
        </tbody>
      </table>
    </div>
    <div class="modal-footer" style="margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeModal('historyModal')">닫기</button>
    </div>
  </div>
</div>

<!-- 수납 등록 모달 -->
<div class="modal-overlay" id="collectModal">
  <div class="modal">
    <h3>보증금/선수금 수납 등록</h3>
    <div class="err-msg" id="collectErr"></div>
    <div class="info-box" id="collectInfo"></div>
    <input type="hidden" id="collectContractId">
    <input type="hidden" id="collectDepositType">
    <div class="mfg">
      <label>거래일자 <span style="color:#dc2626">*</span></label>
      <input type="date" id="collectDate">
    </div>
    <div class="mfg">
      <label>금액 <span style="color:#dc2626">*</span></label>
      <input type="number" id="collectAmount" placeholder="0" min="1">
    </div>
    <div class="mfg">
      <label>메모</label>
      <textarea id="collectMemo" placeholder="메모 입력 (선택)"></textarea>
    </div>
    <div class="mfg">
      <label>전표 자동 생성</label>
      <div class="radio-row">
        <label><input type="radio" name="collectVoucher" value="true"> 예 (전표 생성)</label>
        <label><input type="radio" name="collectVoucher" value="false" checked> 아니오</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('collectModal')">취소</button>
      <button class="btn btn-collect" onclick="submitCollect()">수납 등록</button>
    </div>
  </div>
</div>

<!-- 지급 등록 모달 -->
<div class="modal-overlay" id="refundModal">
  <div class="modal">
    <h3>보증금/선수금 지급(반환) 등록</h3>
    <div class="err-msg" id="refundErr"></div>
    <div class="info-box" id="refundInfo"></div>
    <input type="hidden" id="refundContractId">
    <input type="hidden" id="refundDepositType">
    <div class="mfg">
      <label>거래일자 <span style="color:#dc2626">*</span></label>
      <input type="date" id="refundDate">
    </div>
    <div class="mfg">
      <label>금액 <span style="color:#dc2626">*</span></label>
      <input type="number" id="refundAmount" placeholder="0" min="1">
    </div>
    <div class="mfg">
      <label>메모</label>
      <textarea id="refundMemo" placeholder="메모 입력 (선택)"></textarea>
    </div>
    <div class="mfg">
      <label>전표 자동 생성</label>
      <div class="radio-row">
        <label><input type="radio" name="refundVoucher" value="true"> 예 (전표 생성)</label>
        <label><input type="radio" name="refundVoucher" value="false" checked> 아니오</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('refundModal')">취소</button>
      <button class="btn btn-refund" onclick="submitRefund()">지급 등록</button>
    </div>
  </div>
</div>

<script src="../../assets/js/sidebar.js"></script>
<script>
  const API_BASE_URL = '';

  // ─────────────────────────────────────────────────────────────
  // 목록 조회
  // ─────────────────────────────────────────────────────────────
  function loadList() {
    const startDate   = document.getElementById('startDate').value;
    const endDate     = document.getElementById('endDate').value;
    const type        = document.getElementById('filterType').value;
    const customerName = document.getElementById('filterCustomer').value.trim();

    const params = new URLSearchParams();
    if (startDate)    params.set('startDate',    startDate);
    if (endDate)      params.set('endDate',      endDate);
    if (type)         params.set('type',         type);
    if (customerName) params.set('customerName', customerName);

    fetch(`${API_BASE_URL}/api/deposit-transactions?${params}`, { credentials: 'include' })
      .then(r => r.json())
      .then(data => renderList(data))
      .catch(e => { console.error(e); alert('데이터 조회 중 오류가 발생했습니다.'); });
  }

  function renderList(rows) {
    const tbody = document.getElementById('mainTbody');
    document.getElementById('totalCount').textContent = rows.length;

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" class="empty">조회된 데이터가 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(r => {
      const typeBadge = r.depositType === '보증금'
        ? `<span class="badge badge-deposit">보증금</span>`
        : `<span class="badge badge-advance">선수금</span>`;

      const balanceCls = r.balance > 0 ? 'balance-pos' : 'balance-zero';
      const balance    = `<span class="${balanceCls}">${fmt(r.balance)}</span>`;

      return `
        <tr>
          <td class="center">${esc(r.contractNumber)}</td>
          <td>${esc(r.customerName)}</td>
          <td class="center">${esc(r.vehicleNo)}</td>
          <td class="center">${typeBadge}</td>
          <td class="amount">${fmt(r.contractDepositAmount)}</td>
          <td class="amount">${fmt(r.totalCollected)}</td>
          <td class="amount">${fmt(r.totalRefunded)}</td>
          <td class="amount">${balance}</td>
          <td class="center">${r.startDate || ''}</td>
          <td class="center">${r.endDate || ''}</td>
          <td class="center">${r.lastTransactionDate || '-'}</td>
          <td class="center">
            <button class="btn btn-history btn-sm"
              onclick="openHistory(${r.contractId}, '${esc(r.depositType)}', '${esc(r.customerName)}', '${esc(r.vehicleNo)}', ${r.balance})">
              이력
            </button>
          </td>
          <td class="center">
            <button class="btn btn-collect btn-sm"
              onclick="openCollect(${r.contractId}, '${esc(r.depositType)}', '${esc(r.customerName)}', '${esc(r.vehicleNo)}', ${r.contractDepositAmount}, ${r.balance})">
              수납
            </button>
          </td>
          <td class="center">
            <button class="btn btn-refund btn-sm"
              onclick="openRefund(${r.contractId}, '${esc(r.depositType)}', '${esc(r.customerName)}', '${esc(r.vehicleNo)}', ${r.contractDepositAmount}, ${r.balance})">
              지급
            </button>
          </td>
        </tr>`;
    }).join('');
  }

  // ─────────────────────────────────────────────────────────────
  // 거래이력 모달
  // ─────────────────────────────────────────────────────────────
  function openHistory(contractId, depositType, customerName, vehicleNo, balance) {
    document.getElementById('historyTitle').textContent =
      `거래 이력 — ${customerName} / ${vehicleNo} (${depositType})`;

    document.getElementById('historyInfo').innerHTML =
      `<div class="info-row"><span class="info-label">고객명</span><span class="info-val">${esc(customerName)}</span></div>
       <div class="info-row"><span class="info-label">차량번호</span><span class="info-val">${esc(vehicleNo)}</span></div>
       <div class="info-row"><span class="info-label">현재 잔액</span><span class="info-val" style="color:#059669">${fmt(balance)}원</span></div>`;

    const tbody = document.getElementById('historyTbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty" style="padding:24px">불러오는 중...</td></tr>';
    openModal('historyModal');

    fetch(`${API_BASE_URL}/api/deposit-transactions/${contractId}/history?depositType=${encodeURIComponent(depositType)}`,
          { credentials: 'include' })
      .then(r => r.json())
      .then(rows => {
        if (!rows || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">거래 이력이 없습니다.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(h => {
          const typeCls = h.transactionType === '수납' ? 'color:#2563eb;font-weight:700' : 'color:#dc2626;font-weight:700';
          const cumCls  = h.cumulativeBalance > 0 ? 'color:#059669;font-weight:700' : 'color:#6b7280';
          const voucher = h.voucherCreated
            ? `<span style="background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:4px;font-size:0.78rem;font-weight:700">생성</span>`
            : `<span style="background:#f3f4f6;color:#9ca3af;padding:2px 7px;border-radius:4px;font-size:0.78rem;">없음</span>`;
          return `<tr>
            <td class="center">${h.transactionDate || ''}</td>
            <td class="center"><span style="${typeCls}">${esc(h.transactionType)}</span></td>
            <td class="amount">${fmt(h.amount)}</td>
            <td class="amount"><span style="${cumCls}">${fmt(h.cumulativeBalance)}</span></td>
            <td>${esc(h.memo || '')}</td>
            <td class="center">${voucher}</td>
          </tr>`;
        }).join('');
      })
      .catch(e => {
        tbody.innerHTML = '<tr><td colspan="6" class="empty" style="color:#dc2626">이력 조회 실패</td></tr>';
        console.error(e);
      });
  }

  // ─────────────────────────────────────────────────────────────
  // 수납 모달
  // ─────────────────────────────────────────────────────────────
  function openCollect(contractId, depositType, customerName, vehicleNo, contractAmt, balance) {
    document.getElementById('collectContractId').value  = contractId;
    document.getElementById('collectDepositType').value = depositType;
    document.getElementById('collectDate').value   = today();
    document.getElementById('collectAmount').value = '';
    document.getElementById('collectMemo').value   = '';
    document.querySelectorAll('input[name="collectVoucher"]').forEach(r => { r.checked = r.value === 'false'; });
    hideErr('collectErr');

    document.getElementById('collectInfo').innerHTML =
      `<div class="info-row"><span class="info-label">고객명</span><span class="info-val">${esc(customerName)}</span></div>
       <div class="info-row"><span class="info-label">차량번호</span><span class="info-val">${esc(vehicleNo)}</span></div>
       <div class="info-row"><span class="info-label">유형</span><span class="info-val">${esc(depositType)}</span></div>
       <div class="info-row"><span class="info-label">계약보증금</span><span class="info-val">${fmt(contractAmt)}원</span></div>
       <div class="info-row"><span class="info-label">현재 잔액</span><span class="info-val" style="color:#059669">${fmt(balance)}원</span></div>`;

    openModal('collectModal');
  }

  function submitCollect() {
    hideErr('collectErr');
    const contractId  = parseInt(document.getElementById('collectContractId').value);
    const depositType = document.getElementById('collectDepositType').value;
    const date        = document.getElementById('collectDate').value;
    const amount      = parseInt(document.getElementById('collectAmount').value);
    const memo        = document.getElementById('collectMemo').value.trim();
    const createVoucher = document.querySelector('input[name="collectVoucher"]:checked').value === 'true';

    if (!date)         { showErr('collectErr', '거래일자를 입력하세요.'); return; }
    if (!amount || amount <= 0) { showErr('collectErr', '금액을 올바르게 입력하세요.'); return; }

    fetch(`${API_BASE_URL}/api/deposit-transactions/collect`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contractId, depositType, amount, transactionDate: date, memo, createVoucher })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
    .then(({ ok, data }) => {
      if (!ok) { showErr('collectErr', data.message || '수납 등록 실패'); return; }
      closeModal('collectModal');
      alert('수납이 등록되었습니다.');
      loadList();
    })
    .catch(e => { showErr('collectErr', '서버 오류가 발생했습니다.'); console.error(e); });
  }

  // ─────────────────────────────────────────────────────────────
  // 지급 모달
  // ─────────────────────────────────────────────────────────────
  function openRefund(contractId, depositType, customerName, vehicleNo, contractAmt, balance) {
    document.getElementById('refundContractId').value  = contractId;
    document.getElementById('refundDepositType').value = depositType;
    document.getElementById('refundDate').value   = today();
    document.getElementById('refundAmount').value = '';
    document.getElementById('refundMemo').value   = '';
    document.querySelectorAll('input[name="refundVoucher"]').forEach(r => { r.checked = r.value === 'false'; });
    hideErr('refundErr');

    document.getElementById('refundInfo').innerHTML =
      `<div class="info-row"><span class="info-label">고객명</span><span class="info-val">${esc(customerName)}</span></div>
       <div class="info-row"><span class="info-label">차량번호</span><span class="info-val">${esc(vehicleNo)}</span></div>
       <div class="info-row"><span class="info-label">유형</span><span class="info-val">${esc(depositType)}</span></div>
       <div class="info-row"><span class="info-label">계약보증금</span><span class="info-val">${fmt(contractAmt)}원</span></div>
       <div class="info-row"><span class="info-label">현재 잔액 (최대 지급 가능)</span><span class="info-val" style="color:#dc2626">${fmt(balance)}원</span></div>`;

    openModal('refundModal');
  }

  function submitRefund() {
    hideErr('refundErr');
    const contractId  = parseInt(document.getElementById('refundContractId').value);
    const depositType = document.getElementById('refundDepositType').value;
    const date        = document.getElementById('refundDate').value;
    const amount      = parseInt(document.getElementById('refundAmount').value);
    const memo        = document.getElementById('refundMemo').value.trim();
    const createVoucher = document.querySelector('input[name="refundVoucher"]:checked').value === 'true';

    if (!date)         { showErr('refundErr', '거래일자를 입력하세요.'); return; }
    if (!amount || amount <= 0) { showErr('refundErr', '금액을 올바르게 입력하세요.'); return; }

    fetch(`${API_BASE_URL}/api/deposit-transactions/refund`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contractId, depositType, amount, transactionDate: date, memo, createVoucher })
    })
    .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
    .then(({ ok, data }) => {
      if (!ok) { showErr('refundErr', data.message || '지급 등록 실패'); return; }
      closeModal('refundModal');
      alert('지급(반환)이 등록되었습니다.');
      loadList();
    })
    .catch(e => { showErr('refundErr', '서버 오류가 발생했습니다.'); console.error(e); });
  }

  // ─────────────────────────────────────────────────────────────
  // 유틸
  // ─────────────────────────────────────────────────────────────
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.add('show'); }
  function hideErr(id)      { const el = document.getElementById(id); el.textContent = ''; el.classList.remove('show'); }

  function fmt(v) {
    if (v == null) return '0';
    return Number(v).toLocaleString('ko-KR') + '원';
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  // 모달 외부 클릭 시 닫기
  document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });

  // 초기 전체 조회
  document.addEventListener('DOMContentLoaded', loadList);
</script>
</body>
</html>
