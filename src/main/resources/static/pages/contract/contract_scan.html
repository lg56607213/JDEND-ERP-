<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계약서 스캔 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .btn{padding:8px 18px;border-radius:5px;border:none;cursor:pointer;font-size:.88rem;font-weight:700}
    .btn-primary{background:#23304e;color:#fff}.btn-primary:hover{background:#1b253a}
    .search-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 20px;margin-bottom:14px}
    .search-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
    .sfg{display:flex;flex-direction:column;gap:4px}
    .sfg label{font-size:.8rem;font-weight:700;color:#374151}
    .sfg input[type="text"],.sfg input[type="date"]{padding:8px 11px;border:1px solid #d1d5db;border-radius:5px;font-size:.9rem;height:36px;box-sizing:border-box;outline:none}
    .sfg input:focus{border-color:#23304e}
    .date-sep{color:#9ca3af;align-self:flex-end;line-height:36px;font-size:.9rem}
    .table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 20px}
    .card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
    .card-title{font-size:.95rem;font-weight:700;color:#1b253a}
    .result-count{font-size:.82rem;color:#6b7280}
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead tr{border-top:2px solid #23304e;border-bottom:2px solid #e5e7eb}
    th{padding:9px 10px;font-size:.8rem;font-weight:700;color:#374151;background:#f8fafc;white-space:nowrap;text-align:center}
    td{padding:9px 10px;border-bottom:1px solid #f1f5f9;font-size:.87rem;color:#374151;white-space:nowrap;text-align:center}
    td.l{text-align:left}
    tr:hover td{background:#f9fafb}
    .empty-row td{text-align:center;color:#9ca3af;padding:32px}
    .badge-yes{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;border-radius:10px;padding:2px 10px;font-size:.78rem;font-weight:700}
    .badge-no{background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;border-radius:10px;padding:2px 10px;font-size:.78rem;font-weight:700}
    .btn-up{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-up:hover{background:#dcfce7}
    .btn-list{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-list:hover{background:#dbeafe}
    .btn-view{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-view:hover{background:#dcfce7}
    .btn-dl{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:5px;font-size:.8rem;font-weight:700;padding:4px 10px;text-decoration:none;display:inline-block}
    .btn-dl:hover{background:#dbeafe}
    .btn-del{background:#fff5f5;color:#c53030;border:1px solid #fed7d7;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-del:hover{background:#fed7d7}
    /* 모달 공통 */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
    .modal-backdrop.open{display:flex}
    .modal-box{background:#fff;border-radius:12px;padding:28px;width:min(480px,96vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .modal-box h3{margin:0 0 6px;font-size:1.05rem;font-weight:800;color:#1b253a}
    .modal-sub{color:#6b7280;font-size:.82rem;margin-bottom:18px}
    .modal-field{margin-bottom:14px}
    .modal-field label{display:block;font-size:.82rem;font-weight:700;color:#374151;margin-bottom:5px}
    .modal-field input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #d1d5db;border-radius:6px;font-size:.9rem;outline:none}
    .modal-field input:focus{border-color:#23304e}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
    .btn-cancel-m{padding:9px 18px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:6px;font-weight:600;cursor:pointer;font-size:.88rem}
    .btn-cancel-m:hover{background:#e5e7eb}
    .btn-ok-m{padding:9px 22px;background:#23304e;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:.88rem}
    .btn-ok-m:hover{background:#1b253a}
    /* 목록 모달 */
    .list-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
    .list-backdrop.open{display:flex}
    .list-box{background:#fff;border-radius:12px;width:min(720px,96vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .list-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #eee}
    .list-title{font-weight:700;font-size:1rem;color:#111827}
    .list-close{border:1px solid #ddd;background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .list-close:hover{background:#f5f5f5}
    .list-body{flex:1;overflow-y:auto;padding:16px}
    /* 뷰어 모달 */
    .viewer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10000;align-items:center;justify-content:center}
    .viewer-backdrop.open{display:flex}
    .viewer-box{background:#fff;border-radius:12px;width:min(860px,96vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
    .viewer-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #eee}
    .viewer-title{font-weight:700;font-size:1rem;color:#111827}
    .viewer-close{border:1px solid #ddd;background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .viewer-close:hover{background:#f5f5f5}
    .viewer-body{flex:1;overflow:auto;padding:16px;display:flex;align-items:center;justify-content:center;background:#f8fafc}
    .viewer-body img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:4px}
    .viewer-body iframe{width:100%;height:70vh;border:none}
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="content-wrapper">
  <div class="page-header">
    <h1>계약서 스캔</h1>
    <p>차량관리 &gt; 스캔관리 &gt; 계약서</p>
  </div>

  <div class="search-card">
    <div class="search-row">
      <div class="sfg">
        <label>계약기간</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="date" id="searchStartDate" style="width:140px;">
          <span class="date-sep">~</span>
          <input type="date" id="searchEndDate" style="width:140px;">
        </div>
      </div>
      <div class="sfg">
        <label>계약번호</label>
        <input type="text" id="searchContract" placeholder="계약번호" style="width:160px;" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="sfg">
        <label>차량번호</label>
        <input type="text" id="searchVehicleNo" placeholder="차량번호" style="width:130px;" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <button class="btn btn-primary" onclick="doSearch()">조회</button>
    </div>
  </div>

  <div class="table-card">
    <div class="card-header-row">
      <span class="card-title">계약서 목록</span>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:44px;">#</th>
            <th>계약번호</th>
            <th>고객명</th>
            <th>차량번호</th>
            <th>차량관리번호</th>
            <th>계약기간</th>
            <th style="width:90px;">스캔</th>
            <th style="width:160px;">관리</th>
          </tr>
        </thead>
        <tbody id="scanTableBody">
          <tr class="empty-row"><td colspan="8">조회 버튼을 눌러 검색하세요.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 업로드 모달 -->
<div class="modal-backdrop" id="uploadBackdrop">
  <div class="modal-box">
    <h3>계약서 업로드</h3>
    <p class="modal-sub" id="uploadSubTitle"></p>
    <div class="modal-field">
      <label>파일 선택 <span style="color:#6b7280;font-weight:400;">(PDF/JPG/JPEG/PNG, 최대 10MB)</span></label>
      <input type="file" id="uploadFile" accept=".pdf,.jpg,.jpeg,.png">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel-m" onclick="closeUploadModal()">취소</button>
      <button class="btn-ok-m" onclick="submitUpload()">업로드</button>
    </div>
  </div>
</div>

<!-- 스캔 목록 모달 -->
<div class="list-backdrop" id="scanListBackdrop">
  <div class="list-box">
    <div class="list-header">
      <span class="list-title" id="scanListTitle">스캔 파일 목록</span>
      <button class="list-close" onclick="closeScanListModal()">✕</button>
    </div>
    <div class="list-body">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:36px;">#</th>
              <th>파일명</th>
              <th>크기</th>
              <th>업로드일시</th>
              <th style="width:175px;">관리</th>
            </tr>
          </thead>
          <tbody id="scanListBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 뷰어 모달 -->
<div class="viewer-backdrop" id="viewerBackdrop">
  <div class="viewer-box">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerTitle">문서 보기</span>
      <button class="viewer-close" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</div>

<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/config.js"></script>
<script>
  const BASE = (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '').replace(/\/+$/,'');
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtSize(b){if(!b)return'-';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
  function fmtDt(dt){return dt?String(dt).replace('T',' ').substring(0,16):'-';}

  let _uploadContractNo = '', _uploadVehicleNo = '', _uploadVehicleMgmtNo = '';
  let _scanListContractNo = null;

  async function doSearch() {
    const startDate  = document.getElementById('searchStartDate').value;
    const endDate    = document.getElementById('searchEndDate').value;
    const contractNo = document.getElementById('searchContract').value.trim();
    const vehicleNo  = document.getElementById('searchVehicleNo').value.trim();

    const tbody = document.getElementById('scanTableBody');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">조회 중...</td></tr>';
    document.getElementById('resultCount').textContent = '';

    try {
      // 계약 목록, 문서 목록, 차량 목록을 병렬 조회
      const cqs = new URLSearchParams();
      if (contractNo) cqs.set('contractNumber', contractNo);
      if (vehicleNo)  cqs.set('vehicleNo', vehicleNo);

      const [cRes, dRes, vRes] = await Promise.all([
        fetch(`${BASE}/api/contracts/status?${cqs}`, {credentials:'include'}),
        fetch(`${BASE}/api/documents?documentType=계약서`, {credentials:'include'}),
        fetch(`${BASE}/api/vehicle-orders?registerDateStart=&registerDateEnd=`, {credentials:'include'})
      ]);
      if (!cRes.ok) throw new Error('계약 조회 HTTP ' + cRes.status);
      if (!dRes.ok) throw new Error('문서 조회 HTTP ' + dRes.status);

      let contracts = await cRes.json();
      const docs    = await dRes.json();

      // vehicleNo → vehicleMgmtNo Map (차량관리번호 연동)
      const vehicleMap = {};
      if (vRes.ok) {
        const vehicles = await vRes.json();
        vehicles.forEach(v => { if (v.vehicleNo) vehicleMap[v.vehicleNo] = v.vehicleMgmtNo || ''; });
      }

      // contractNumber → 문서 배열 Map
      const docMap = {};
      docs.forEach(d => {
        if (d.contractNumber) {
          if (!docMap[d.contractNumber]) docMap[d.contractNumber] = [];
          docMap[d.contractNumber].push(d);
        }
      });

      // 계약기간 클라이언트 필터 (contract.startDate 기준)
      if (startDate) contracts = contracts.filter(c => c.startDate && c.startDate >= startDate);
      if (endDate)   contracts = contracts.filter(c => c.startDate && c.startDate <= endDate);

      document.getElementById('resultCount').textContent = contracts.length + '건';

      if (!contracts.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">조회 결과가 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = contracts.map((c, i) => {
        const hasScan = !!(docMap[c.contractNumber] && docMap[c.contractNumber].length > 0);
        const badge   = hasScan ? '<span class="badge-yes">스캔완료</span>' : '<span class="badge-no">미스캔</span>';
        const cno     = esc(c.contractNumber || '-');
        const cust    = esc(c.customerName || '-');
        const vno     = esc(c.vehicleNo || '-');
        const mgmtNo  = esc(vehicleMap[c.vehicleNo] || '-');
        const period  = esc((c.startDate || '-') + ' ~ ' + (c.endDate || '-'));
        return `<tr>
          <td>${i+1}</td>
          <td>${cno}</td>
          <td>${cust}</td>
          <td>${vno}</td>
          <td>${mgmtNo}</td>
          <td>${period}</td>
          <td>${badge}</td>
          <td>
            <button class="btn-up"
              data-contract-no="${cno}"
              data-vehicle-no="${vno}"
              data-mgmt-no="${mgmtNo}"
              onclick="openUploadModal(this)">업로드</button>&nbsp;
            <button class="btn-list"
              data-contract-no="${cno}"
              data-label="${cno} / ${cust}"
              onclick="openScanListModal(this)">목록</button>
          </td>
        </tr>`;
      }).join('');
    } catch(e) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8" style="color:#ef4444;">오류: ${esc(e.message)}</td></tr>`;
    }
  }

  // ── 업로드 모달 ─────────────────────────────────
  function openUploadModal(btn) {
    _uploadContractNo   = btn.dataset.contractNo || '';
    _uploadVehicleNo    = btn.dataset.vehicleNo || '';
    _uploadVehicleMgmtNo = btn.dataset.mgmtNo || '';
    document.getElementById('uploadSubTitle').textContent =
      '계약번호: ' + (_uploadContractNo || '-') + ' / 차량번호: ' + (_uploadVehicleNo || '-');
    document.getElementById('uploadFile').value = '';
    document.getElementById('uploadBackdrop').classList.add('open');
  }
  function closeUploadModal() { document.getElementById('uploadBackdrop').classList.remove('open'); }

  async function submitUpload() {
    const file = document.getElementById('uploadFile').files[0];
    if (!file) { alert('파일을 선택하세요.'); return; }
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','jpg','jpeg','png'].includes(ext)) { alert('PDF, JPG, JPEG, PNG만 가능합니다.'); return; }
    if (file.size > 10*1024*1024) { alert('최대 10MB까지 업로드 가능합니다.'); return; }

    const form = new FormData();
    form.append('documentType', '계약서');
    if (_uploadContractNo && _uploadContractNo !== '-') form.append('contractNumber', _uploadContractNo);
    if (_uploadVehicleNo  && _uploadVehicleNo  !== '-') form.append('vehicleNo', _uploadVehicleNo);
    if (_uploadVehicleMgmtNo && _uploadVehicleMgmtNo !== '-') form.append('vehicleMgmtNo', _uploadVehicleMgmtNo);
    form.append('file', file);

    try {
      const res = await fetch(`${BASE}/api/documents/upload`, {method:'POST', body:form, credentials:'include'});
      if (!res.ok) { const b = await res.json().catch(()=>{}); throw new Error(b?.error || 'HTTP '+res.status); }
      alert('업로드 완료!');
      closeUploadModal();
      doSearch();
    } catch(e) { alert('업로드 실패: '+e.message); }
  }

  // ── 스캔 목록 모달 ──────────────────────────────
  function openScanListModal(btn) {
    _scanListContractNo = btn.dataset.contractNo;
    document.getElementById('scanListTitle').textContent = '스캔 파일 목록 - ' + (btn.dataset.label || '');
    document.getElementById('scanListBody').innerHTML =
      '<tr><td colspan="5" style="text-align:center;padding:20px;">불러오는 중...</td></tr>';
    document.getElementById('scanListBackdrop').classList.add('open');
    refreshScanList();
  }
  function closeScanListModal() { document.getElementById('scanListBackdrop').classList.remove('open'); }

  async function refreshScanList() {
    try {
      const res = await fetch(
        `${BASE}/api/documents?documentType=계약서&contractNumber=${encodeURIComponent(_scanListContractNo)}`,
        {credentials:'include'}
      );
      if (!res.ok) throw new Error('HTTP '+res.status);
      const docs = await res.json();
      if (!docs.length) {
        document.getElementById('scanListBody').innerHTML =
          '<tr><td colspan="5" style="text-align:center;color:#9ca3af;padding:20px;">스캔 파일이 없습니다.</td></tr>';
        return;
      }
      document.getElementById('scanListBody').innerHTML = docs.map((d,i) => `
        <tr>
          <td>${i+1}</td>
          <td class="l">${esc(d.fileName||'-')}</td>
          <td>${fmtSize(d.fileSize)}</td>
          <td>${fmtDt(d.uploadedAt)}</td>
          <td>
            <button class="btn-view" data-doc-id="${d.id}" data-file-name="${esc(d.fileName||'')}" onclick="openViewer(this)">보기</button>&nbsp;
            <a href="${BASE}/api/documents/${d.id}/download" class="btn-dl">다운로드</a>&nbsp;
            <button class="btn-del" data-doc-id="${d.id}" onclick="deleteScan(this)">삭제</button>
          </td>
        </tr>`).join('');
    } catch(e) {
      document.getElementById('scanListBody').innerHTML =
        `<tr><td colspan="5" style="color:#ef4444;text-align:center;">오류: ${esc(e.message)}</td></tr>`;
    }
  }

  async function deleteScan(btn) {
    if (!confirm('이 파일을 삭제하시겠습니까?')) return;
    const id = btn.dataset.docId;
    try {
      const res = await fetch(`${BASE}/api/documents/${id}`, {method:'DELETE', credentials:'include'});
      if (!res.ok) throw new Error('HTTP '+res.status);
      alert('삭제되었습니다.');
      await refreshScanList();
      doSearch();
    } catch(e) { alert('삭제 실패: '+e.message); }
  }

  // ── 뷰어 모달 ───────────────────────────────────
  function openViewer(btn) {
    const id       = btn.dataset.docId;
    const fileName = btn.dataset.fileName || '문서 보기';
    const url  = `${BASE}/api/documents/${id}/view`;
    const ext  = fileName.split('.').pop().toLowerCase();
    document.getElementById('viewerTitle').textContent = fileName;
    const body = document.getElementById('viewerBody');
    body.innerHTML = ['jpg','jpeg','png','gif','webp'].includes(ext)
      ? `<img src="${url}" alt="${esc(fileName)}">`
      : `<iframe src="${url}" title="${esc(fileName)}"></iframe>`;
    document.getElementById('viewerBackdrop').classList.add('open');
  }
  function closeViewer() {
    document.getElementById('viewerBackdrop').classList.remove('open');
    document.getElementById('viewerBody').innerHTML = '';
  }

  // ── ESC / backdrop click ─────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('viewerBackdrop').classList.contains('open'))   { closeViewer(); return; }
    if (document.getElementById('scanListBackdrop').classList.contains('open')) { closeScanListModal(); return; }
    if (document.getElementById('uploadBackdrop').classList.contains('open'))   { closeUploadModal(); return; }
  });
  ['uploadBackdrop','scanListBackdrop','viewerBackdrop'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target !== document.getElementById(id)) return;
      if (id === 'uploadBackdrop')   closeUploadModal();
      if (id === 'scanListBackdrop') closeScanListModal();
      if (id === 'viewerBackdrop')   closeViewer();
    });
  });

  document.addEventListener('DOMContentLoaded', doSearch);
</script>
</body>
</html>
