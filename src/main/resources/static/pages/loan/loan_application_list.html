<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대출신청 관리 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .sum-card {
      flex:1; min-width:140px; background:#fff; border:1px solid #e5e7eb;
      border-radius:10px; padding:14px 16px;
    }
    .sum-card .k { font-size:12px; color:#6b7280; margin-bottom:6px; }
    .sum-card .v { font-size:22px; font-weight:700; }
    .sum-new .v { color:#d93025; }
    .sum-reviewing .v { color:#1a56db; }
    .sum-done .v { color:#137333; }

    .search-section { background:#f8f9fa; border-radius:8px; padding:16px; margin-bottom:16px; }
    .search-grid { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:12px; font-weight:600; color:#555; }
    .form-group input, .form-group select {
      height:34px; padding:0 10px; border:1px solid #ccc; border-radius:5px; font-size:13px;
    }
    .btn-search {
      height:34px; padding:0 20px; background:#1a73e8; color:#fff;
      border:none; border-radius:5px; font-size:13px; cursor:pointer;
    }

    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#f1f3f4; font-weight:600; color:#444; padding:10px 8px; text-align:center;
         border-bottom:2px solid #ddd; white-space:nowrap; }
    td { padding:9px 8px; border-bottom:1px solid #eee; text-align:center; color:#333; }
    td.left { text-align:left; }
    tr:hover td { background:#f9fbff; }
    td.no-data { text-align:center; color:#aaa; padding:40px; }
    .company { font-weight:700; color:#111827; }

    .badge { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; }
    .b-phone { background:#fff3cd; color:#8a6d00; }
    .b-form  { background:#e0f2fe; color:#0369a1; }

    .row-select { height:30px; border:1px solid #ddd; border-radius:5px; font-size:12px; }
    .cell-input { width:100%; min-width:130px; border:1px solid #ddd; border-radius:4px;
                  padding:4px 8px; font-size:12px; box-sizing:border-box; }
    .btn-save-row {
      height:28px; padding:0 10px; background:#1a73e8; color:#fff; border:none;
      border-radius:4px; font-size:12px; cursor:pointer;
    }
    .denied { padding:60px 20px; text-align:center; color:#6b7280; }

    @media (max-width: 768px) {
      .sum-card { min-width:calc(50% - 6px); }
      .tbl-wrap > table { min-width:1100px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>대출신청 관리</h1>
      <p>금융 &gt; 대출신청 관리 (운영자)</p>
    </div>

    <div class="erp-card">
      <div class="card-body">

        <div id="deniedView" class="denied" style="display:none;">
          운영자 계정만 접근할 수 있는 화면입니다.
        </div>

        <div id="mainView">
          <div class="summary">
            <div class="sum-card sum-new">
              <div class="k">접수 (미처리)</div>
              <div class="v" id="cntNew">-</div>
            </div>
            <div class="sum-card sum-reviewing">
              <div class="k">심사·알선중</div>
              <div class="v" id="cntReviewing">-</div>
            </div>
            <div class="sum-card sum-done">
              <div class="k">실행완료</div>
              <div class="v" id="cntDone">-</div>
            </div>
          </div>

          <div class="search-section">
            <div class="search-grid">
              <div class="form-group">
                <label for="fStatus">상태</label>
                <select id="fStatus" style="width:140px;">
                  <option value="">전체</option>
                  <option value="NEW">접수</option>
                  <option value="REVIEWING">심사·알선중</option>
                  <option value="DONE">실행완료</option>
                  <option value="REJECTED">부결</option>
                  <option value="CANCELED">취소</option>
                </select>
              </div>
              <div class="form-group">
                <label for="fFrom">신청일(시작)</label>
                <input type="date" id="fFrom" style="width:150px;">
              </div>
              <div class="form-group">
                <label for="fTo">신청일(종료)</label>
                <input type="date" id="fTo" style="width:150px;">
              </div>
              <div class="form-group">
                <label>&nbsp;</label>
                <button class="btn-search" onclick="loadList()">조회</button>
              </div>
            </div>
          </div>

          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:44px;">No</th>
                  <th>신청일시</th>
                  <th>업체명</th>
                  <th>구분</th>
                  <th>담당자</th>
                  <th>연락처</th>
                  <th>차종</th>
                  <th>대수</th>
                  <th>출고예상</th>
                  <th>할부/리스</th>
                  <th>선납금</th>
                  <th>기간</th>
                  <th>요청사항</th>
                  <th style="width:120px;">상태</th>
                  <th style="width:160px;">업체 안내문구</th>
                  <th style="width:160px;">내부메모</th>
                  <th style="width:60px;">저장</th>
                </tr>
              </thead>
              <tbody id="listBody">
                <tr><td colspan="17" class="no-data">불러오는 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function esc(s) {
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;');
    }
    function fmtDt(dt) { return dt ? String(dt).replace('T',' ').substring(0,16) : '-'; }

    const STATUS_LABEL = {
      NEW: '접수', REVIEWING: '심사·알선중', DONE: '실행완료',
      REJECTED: '부결', CANCELED: '취소'
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const d = new Date();
      $('fFrom').value = new Date(d.getFullYear(), d.getMonth() - 2, 1).toISOString().split('T')[0];
      $('fTo').value   = new Date().toISOString().split('T')[0];
      await loadSummary();
      await loadList();
    });

    function showDenied() {
      $('mainView').style.display = 'none';
      $('deniedView').style.display = '';
    }

    async function loadSummary() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications/admin/summary`);
        if (res.status === 403) { showDenied(); return; }
        if (!res.ok) return;
        const d = await res.json();
        $('cntNew').textContent = d.newCount;
        $('cntReviewing').textContent = d.reviewingCount;
        $('cntDone').textContent = d.doneCount;
      } catch (e) { console.warn('요약 조회 실패', e); }
    }

    async function loadList() {
      const qs = new URLSearchParams();
      if ($('fStatus').value) qs.set('status', $('fStatus').value);
      if ($('fFrom').value)   qs.set('from', $('fFrom').value);
      if ($('fTo').value)     qs.set('to', $('fTo').value);

      const tbody = $('listBody');
      tbody.innerHTML = '<tr><td colspan="17" class="no-data">불러오는 중...</td></tr>';
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications/admin?` + qs.toString());
        if (res.status === 403) { showDenied(); return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="17" class="no-data">조회 실패: ${esc(e.message)}</td></tr>`;
      }
    }

    function render(list) {
      const tbody = $('listBody');
      if (!list || !list.length) {
        tbody.innerHTML = '<tr><td colspan="17" class="no-data">신청 내역이 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map((a, i) => {
        const typeCls = a.inquiryTypeLabel === '유선상담' ? 'b-phone' : 'b-form';
        const opts = Object.entries(STATUS_LABEL).map(([k, v]) =>
          `<option value="${k}" ${a.status === k ? 'selected' : ''}>${v}</option>`).join('');
        return `<tr>
          <td>${i + 1}</td>
          <td>${fmtDt(a.createdAt)}</td>
          <td class="left company">${esc(a.companyName || '-')}</td>
          <td><span class="badge ${typeCls}">${esc(a.inquiryTypeLabel)}</span></td>
          <td>${esc(a.managerName || '-')}</td>
          <td><a href="tel:${esc(a.contactPhone)}">${esc(a.contactPhone)}</a></td>
          <td class="left">${esc(a.carModel || '-')}</td>
          <td>${a.vehicleCount ? a.vehicleCount + '대' : '-'}</td>
          <td>${esc(a.expectedDelivery || '-')}</td>
          <td>${esc(a.financeType || '-')}</td>
          <td>${a.downPaymentPercent ? a.downPaymentPercent + '%' : '-'}</td>
          <td>${a.termMonths ? a.termMonths + '개월' : '-'}</td>
          <td class="left">${esc(a.memo || '-')}</td>
          <td><select class="row-select" data-id="${a.id}" data-f="status">${opts}</select></td>
          <td><input class="cell-input" data-id="${a.id}" data-f="reply"
                     value="${esc(a.replyMessage || '')}" placeholder="업체에 보일 안내"></td>
          <td><input class="cell-input" data-id="${a.id}" data-f="memo"
                     value="${esc(a.adminMemo || '')}" placeholder="내부용"></td>
          <td><button class="btn-save-row" onclick="saveRow(${a.id})">저장</button></td>
        </tr>`;
      }).join('');
    }

    async function saveRow(id) {
      const pick = f => document.querySelector(`[data-id="${id}"][data-f="${f}"]`).value;
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications/admin/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: pick('status'),
            replyMessage: pick('reply'),
            adminMemo: pick('memo')
          })
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.message || `HTTP ${res.status}`);
        }
        await loadSummary();
        alert('저장되었습니다.');
      } catch (e) {
        alert('저장 실패: ' + e.message);
      }
    }
  </script>
</body>
</html>
