<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대출신청 현황 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .sum-card {
      flex:1; min-width:130px; background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      padding:14px 16px;
    }
    .sum-card .k { font-size:12px; color:#6b7280; margin-bottom:6px; }
    .sum-card .v { font-size:22px; font-weight:700; }
    .sum-new .v { color:#d93025; }
    .sum-contacted .v { color:#1a56db; }
    .sum-done .v { color:#137333; }

    .link-box {
      background:#eff4ff; border:1px solid #c5d9f7; border-radius:10px;
      padding:14px 16px; margin-bottom:16px;
    }
    .link-box .t { font-size:13px; font-weight:700; color:#1a56db; margin-bottom:8px; }
    .link-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .link-row input {
      flex:1; min-width:240px; height:38px; padding:0 10px; font-size:13px;
      border:1px solid #c5d9f7; border-radius:6px; background:#fff; color:#374151;
    }
    .link-desc { font-size:12px; color:#6b7280; margin-top:8px; line-height:1.6; }

    .search-section { background:#f8f9fa; border-radius:8px; padding:16px; margin-bottom:16px; }
    .search-grid { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:12px; font-weight:600; color:#555; }
    .form-group input, .form-group select {
      height:34px; padding:0 10px; border:1px solid #ccc; border-radius:5px; font-size:13px;
    }
    .btn-search {
      height:34px; padding:0 20px; background:#1a73e8; color:#fff;
      border:none; border-radius:5px; font-size:13px; cursor:pointer;
    }

    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#f1f3f4; font-weight:600; color:#444; padding:10px 8px; text-align:center;
         border-bottom:2px solid #ddd; white-space:nowrap; }
    td { padding:9px 8px; border-bottom:1px solid #eee; text-align:center; color:#333; }
    td.left { text-align:left; }
    tr:hover td { background:#f9fbff; }
    td.no-data { text-align:center; color:#aaa; padding:40px; }

    .badge { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; }
    .b-phone { background:#fff3cd; color:#8a6d00; }
    .b-form  { background:#e0f2fe; color:#0369a1; }
    .st-NEW       { background:#fce8e6; color:#c5221f; }
    .st-CONTACTED { background:#e8f0fe; color:#1a56db; }
    .st-DONE      { background:#e6f4ea; color:#137333; }
    .st-CANCELED  { background:#f1f3f4; color:#5f6368; }

    .row-select { height:30px; border:1px solid #ddd; border-radius:5px; font-size:12px; }
    .memo-input { width:100%; min-width:120px; border:1px solid #ddd; border-radius:4px;
                  padding:4px 8px; font-size:12px; box-sizing:border-box; }
    .btn-save-row {
      height:28px; padding:0 10px; background:#1a73e8; color:#fff; border:none;
      border-radius:4px; font-size:12px; cursor:pointer;
    }

    @media (max-width: 768px) {
      .sum-card { min-width:calc(50% - 6px); }
      .tbl-wrap > table { min-width:900px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>대출신청 현황</h1>
      <p>대출신청 &gt; 신청현황</p>
    </div>

    <div class="erp-card">
      <div class="card-body">

        <!-- 요약 -->
        <div class="summary">
          <div class="sum-card sum-new">
            <div class="k">접수 (미처리)</div>
            <div class="v" id="cntNew">-</div>
          </div>
          <div class="sum-card sum-contacted">
            <div class="k">상담중</div>
            <div class="v" id="cntContacted">-</div>
          </div>
          <div class="sum-card sum-done">
            <div class="k">완료</div>
            <div class="v" id="cntDone">-</div>
          </div>
        </div>

        <!-- 신청 링크 -->
        <div class="link-box">
          <div class="t">🔗 고객에게 보낼 신청 링크</div>
          <div class="link-row">
            <input type="text" id="applyUrl" readonly>
            <button class="btn-search" onclick="copyLink()">링크 복사</button>
            <button class="btn-search" style="background:#34a853;" onclick="openLink()">미리보기</button>
          </div>
          <div class="link-desc">
            이 링크를 문자·카톡으로 보내시면 고객이 직접 신청할 수 있습니다.
            신청이 들어오면 등록된 메일로 알림이 발송되고, 아래 목록에 표시됩니다.
          </div>
        </div>

        <!-- 조회 -->
        <div class="search-section">
          <div class="search-grid">
            <div class="form-group">
              <label for="fStatus">상태</label>
              <select id="fStatus" style="width:130px;">
                <option value="">전체</option>
                <option value="NEW">접수</option>
                <option value="CONTACTED">상담중</option>
                <option value="DONE">완료</option>
                <option value="CANCELED">취소</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fFrom">접수일(시작)</label>
              <input type="date" id="fFrom" style="width:150px;">
            </div>
            <div class="form-group">
              <label for="fTo">접수일(종료)</label>
              <input type="date" id="fTo" style="width:150px;">
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn-search" onclick="loadList()">조회</button>
            </div>
          </div>
        </div>

        <!-- 목록 -->
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:44px;">No</th>
                <th>접수일시</th>
                <th>구분</th>
                <th>신청자</th>
                <th>연락처</th>
                <th>차종</th>
                <th>출고예상</th>
                <th>할부/리스</th>
                <th>선납금</th>
                <th>기간</th>
                <th>요청사항</th>
                <th style="width:110px;">상태</th>
                <th style="width:180px;">담당메모</th>
                <th style="width:60px;">저장</th>
              </tr>
            </thead>
            <tbody id="listBody">
              <tr><td colspan="14" class="no-data">조회 버튼을 눌러주세요.</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script>
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;');
    }
    function fmtDt(dt) { return dt ? String(dt).replace('T',' ').substring(0,16) : '-'; }

    const STATUS_LABEL = {
      NEW: '접수', CONTACTED: '상담중', DONE: '완료', CANCELED: '취소'
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const d = new Date();
      $('fFrom').value = new Date(d.getFullYear(), d.getMonth() - 1, 1).toISOString().split('T')[0];
      $('fTo').value   = new Date().toISOString().split('T')[0];
      await loadSummary();
      await loadList();
    });

    async function loadSummary() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications/summary`);
        if (!res.ok) return;
        const d = await res.json();
        $('cntNew').textContent = d.newCount;
        $('cntContacted').textContent = d.contactedCount;
        $('cntDone').textContent = d.doneCount;
        $('applyUrl').value = d.applyUrl || '';
      } catch (e) { console.warn('요약 조회 실패', e); }
    }

    async function loadList() {
      const qs = new URLSearchParams();
      if ($('fStatus').value) qs.set('status', $('fStatus').value);
      if ($('fFrom').value)   qs.set('from', $('fFrom').value);
      if ($('fTo').value)     qs.set('to', $('fTo').value);

      const tbody = $('listBody');
      tbody.innerHTML = '<tr><td colspan="14" class="no-data">불러오는 중...</td></tr>';
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications?` + qs.toString());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="14" class="no-data">조회 실패: ${esc(e.message)}</td></tr>`;
      }
    }

    function render(list) {
      const tbody = $('listBody');
      if (!list || !list.length) {
        tbody.innerHTML = '<tr><td colspan="14" class="no-data">신청 내역이 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map((a, i) => {
        const typeCls = a.inquiryType === 'PHONE' ? 'b-phone' : 'b-form';
        const opts = Object.entries(STATUS_LABEL).map(([k, v]) =>
          `<option value="${k}" ${a.status === k ? 'selected' : ''}>${v}</option>`).join('');
        return `<tr>
          <td>${i + 1}</td>
          <td>${fmtDt(a.createdAt)}</td>
          <td><span class="badge ${typeCls}">${esc(a.inquiryTypeLabel)}</span></td>
          <td>${esc(a.applicantName || '-')}</td>
          <td><a href="tel:${esc(a.contactPhone)}">${esc(a.contactPhone)}</a></td>
          <td class="left">${esc(a.carModel || '-')}</td>
          <td>${esc(a.expectedDelivery || '-')}</td>
          <td>${esc(a.financeType || '-')}</td>
          <td>${a.downPaymentPercent ? a.downPaymentPercent + '%' : '-'}</td>
          <td>${a.termMonths ? a.termMonths + '개월' : '-'}</td>
          <td class="left">${esc(a.memo || '-')}</td>
          <td>
            <select class="row-select" data-id="${a.id}" data-f="status">${opts}</select>
          </td>
          <td>
            <input class="memo-input" type="text" data-id="${a.id}" data-f="memo"
                   value="${esc(a.adminMemo || '')}" placeholder="메모">
          </td>
          <td><button class="btn-save-row" onclick="saveRow(${a.id})">저장</button></td>
        </tr>`;
      }).join('');
    }

    async function saveRow(id) {
      const status = document.querySelector(`[data-id="${id}"][data-f="status"]`).value;
      const adminMemo = document.querySelector(`[data-id="${id}"][data-f="memo"]`).value;
      try {
        const res = await fetch(`${API_BASE_URL}/api/loan-applications/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, adminMemo })
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.message || `HTTP ${res.status}`);
        }
        await loadSummary();
        alert('저장되었습니다.');
      } catch (e) {
        alert('저장 실패: ' + e.message);
      }
    }

    async function copyLink() {
      const url = $('applyUrl').value;
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        alert('링크를 복사했습니다.\n문자나 카톡으로 고객에게 보내세요.');
      } catch (e) {
        $('applyUrl').select();
        alert('복사에 실패했습니다. 주소를 직접 복사해 주세요.');
      }
    }

    function openLink() {
      const url = $('applyUrl').value;
      if (url) window.open(url, '_blank');
    }
  </script>
</body>
</html>
