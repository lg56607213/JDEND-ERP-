<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보험증권 스캔 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .btn{padding:8px 18px;border-radius:5px;border:none;cursor:pointer;font-size:.88rem;font-weight:700}
    .btn-primary{background:#23304e;color:#fff}.btn-primary:hover{background:#1b253a}
    .search-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 20px;margin-bottom:14px}
    .search-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
    .sfg{display:flex;flex-direction:column;gap:4px}
    .sfg label{font-size:.8rem;font-weight:700;color:#374151}
    .sfg input[type="text"]{padding:8px 11px;border:1px solid #d1d5db;border-radius:5px;font-size:.9rem;height:36px;box-sizing:border-box;outline:none}
    .sfg input:focus{border-color:#23304e}
    .table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 20px}
    .card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
    .card-title{font-size:.95rem;font-weight:700;color:#1b253a}
    .result-count{font-size:.82rem;color:#6b7280}
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead tr{border-top:2px solid #23304e;border-bottom:2px solid #e5e7eb}
    th{padding:9px 10px;font-size:.8rem;font-weight:700;color:#374151;background:#f8fafc;white-space:nowrap;text-align:center}
    td{padding:9px 10px;border-bottom:1px solid #f1f5f9;font-size:.87rem;color:#374151;white-space:nowrap;text-align:center}
    td.l{text-align:left}
    tr:hover td{background:#f9fafb}
    .empty-row td{text-align:center;color:#9ca3af;padding:32px}
    .btn-view{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-view:hover{background:#dcfce7}
    .btn-dl{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:5px;font-size:.8rem;font-weight:700;padding:4px 10px;text-decoration:none;display:inline-block}
    .btn-dl:hover{background:#dbeafe}
    .btn-del{background:#fff5f5;color:#c53030;border:1px solid #fed7d7;border-radius:5px;cursor:pointer;font-size:.8rem;font-weight:700;padding:4px 10px}
    .btn-del:hover{background:#fed7d7}
    /* 업로드 모달 */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
    .modal-backdrop.open{display:flex}
    .modal-box{background:#fff;border-radius:12px;padding:28px;width:min(480px,96vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .modal-box h3{margin:0 0 6px;font-size:1.05rem;font-weight:800;color:#1b253a}
    .modal-sub{color:#6b7280;font-size:.82rem;margin-bottom:18px}
    .modal-field{margin-bottom:14px}
    .modal-field label{display:block;font-size:.82rem;font-weight:700;color:#374151;margin-bottom:5px}
    .modal-field input,.modal-field select{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #d1d5db;border-radius:6px;font-size:.9rem;outline:none}
    .modal-field input:focus,.modal-field select:focus{border-color:#23304e}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
    .btn-cancel-m{padding:9px 18px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:6px;font-weight:600;cursor:pointer;font-size:.88rem}
    .btn-cancel-m:hover{background:#e5e7eb}
    .btn-ok-m{padding:9px 22px;background:#23304e;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:.88rem}
    .btn-ok-m:hover{background:#1b253a}
    /* 뷰어 모달 */
    .viewer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10000;align-items:center;justify-content:center}
    .viewer-backdrop.open{display:flex}
    .viewer-box{background:#fff;border-radius:12px;width:min(860px,96vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
    .viewer-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #eee}
    .viewer-title{font-weight:700;font-size:1rem;color:#111827}
    .viewer-close{border:1px solid #ddd;background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .viewer-close:hover{background:#f5f5f5}
    .viewer-body{flex:1;overflow:auto;padding:16px;display:flex;align-items:center;justify-content:center;background:#f8fafc}
    .viewer-body img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:4px}
    .viewer-body iframe{width:100%;height:70vh;border:none}
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="content-wrapper">
  <div class="page-header">
    <h1>보험증권 스캔</h1>
    <p>차량관리 &gt; 스캔관리 &gt; 보험증권</p>
  </div>

  <div class="search-card">
    <div class="search-row">
      <div class="sfg">
        <label>차량번호 <span style="color:#ef4444;">*</span></label>
        <input type="text" id="searchVehicleNo" placeholder="예) 12가3456" style="width:160px;"
               onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <button class="btn btn-primary" onclick="doSearch()">조회</button>
      <button class="btn" style="background:#3b82f6;color:#fff;" onclick="openUploadModal()">업로드</button>
    </div>
  </div>

  <div class="table-card">
    <div class="card-header-row">
      <span class="card-title">보험증권 스캔 목록</span>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:44px;">#</th>
            <th>파일명</th>
            <th>차량번호</th>
            <th>보험시작일</th>
            <th>보험종료일</th>
            <th>크기</th>
            <th>업로드일시</th>
            <th style="width:180px;">관리</th>
          </tr>
        </thead>
        <tbody id="scanTableBody">
          <tr class="empty-row"><td colspan="8">차량번호를 입력하고 조회하세요.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 업로드 모달 -->
<div class="modal-backdrop" id="uploadBackdrop">
  <div class="modal-box">
    <h3>보험증권 업로드</h3>
    <p class="modal-sub">차량번호로 보험을 선택한 뒤 파일을 업로드합니다.</p>
    <div class="modal-field">
      <label>차량번호 <span style="color:#ef4444;">*</span></label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="uploadVehicleNo" placeholder="예) 12가3456" style="flex:1;">
        <button class="btn-ok-m" style="white-space:nowrap;" onclick="loadInsuranceList()">조회</button>
      </div>
    </div>
    <div class="modal-field" id="insuranceSelectField" style="display:none;">
      <label>보험 선택 <span style="color:#ef4444;">*</span></label>
      <select id="insuranceSelect">
        <option value="">-- 보험 선택 --</option>
      </select>
    </div>
    <div class="modal-field">
      <label>파일 선택 <span style="color:#6b7280;font-weight:400;">(PDF/JPG/JPEG/PNG, 최대 10MB)</span></label>
      <input type="file" id="uploadFile" accept=".pdf,.jpg,.jpeg,.png">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel-m" onclick="closeUploadModal()">취소</button>
      <button class="btn-ok-m" onclick="submitUpload()">업로드</button>
    </div>
  </div>
</div>

<!-- 뷰어 모달 -->
<div class="viewer-backdrop" id="viewerBackdrop">
  <div class="viewer-box">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerTitle">문서 보기</span>
      <button class="viewer-close" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</div>

<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/config.js"></script>
<script>
  const BASE = (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '').replace(/\/+$/,'');
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtSize(b){if(!b)return'-';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
  function fmtDt(dt){return dt?String(dt).replace('T',' ').substring(0,16):'-';}

  // 차량번호 → 보험 목록 → 문서 조회
  async function doSearch() {
    const vehicleNo = document.getElementById('searchVehicleNo').value.trim();
    if (!vehicleNo) { alert('차량번호를 입력하세요.'); document.getElementById('searchVehicleNo').focus(); return; }

    const tbody = document.getElementById('scanTableBody');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">조회 중...</td></tr>';
    document.getElementById('resultCount').textContent = '';

    try {
      // 1) 차량번호로 보험 목록 조회
      const insRes = await fetch(`${BASE}/api/insurances?vehicleNo=${encodeURIComponent(vehicleNo)}`, {credentials:'include'});
      if (!insRes.ok) throw new Error('보험 조회 HTTP ' + insRes.status);
      const insurances = await insRes.json();

      if (!insurances.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">해당 차량번호의 보험 데이터가 없습니다.</td></tr>';
        return;
      }

      // 2) 각 보험 ID로 문서 조회 (병렬)
      const docResults = await Promise.all(
        insurances.map(ins =>
          fetch(`${BASE}/api/documents?documentType=보험증권&insuranceId=${ins.id}`, {credentials:'include'})
            .then(r => r.ok ? r.json() : [])
            .then(docs => docs.map(d => ({...d, _vehicleNo: ins.vehicleNo || vehicleNo, _insStart: ins.insuranceStartDate, _insEnd: ins.insuranceEndDate})))
            .catch(() => [])
        )
      );
      const allDocs = docResults.flat();

      document.getElementById('resultCount').textContent = allDocs.length + '건';
      if (!allDocs.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">스캔된 보험증권 파일이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = allDocs.map((d,i)=>`
        <tr>
          <td>${i+1}</td>
          <td class="l">${esc(d.fileName||'-')}</td>
          <td>${esc(d._vehicleNo||'-')}</td>
          <td>${esc(d._insStart||'-')}</td>
          <td>${esc(d._insEnd||'-')}</td>
          <td>${fmtSize(d.fileSize)}</td>
          <td>${fmtDt(d.uploadedAt)}</td>
          <td>
            <button class="btn-view" onclick="openViewer(${d.id},'${esc(d.fileName)}')">보기</button>&nbsp;
            <a href="${BASE}/api/documents/${d.id}/download" class="btn-dl">다운로드</a>&nbsp;
            <button class="btn-del" onclick="deleteScan(${d.id})">삭제</button>
          </td>
        </tr>`).join('');
    } catch(e) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8" style="color:#ef4444;">오류: ${esc(e.message)}</td></tr>`;
    }
  }

  // ── 업로드 모달 ────────────────────────────────
  function openUploadModal() {
    const searchVehicleNo = document.getElementById('searchVehicleNo').value.trim();
    document.getElementById('uploadVehicleNo').value = searchVehicleNo;
    document.getElementById('insuranceSelectField').style.display = 'none';
    document.getElementById('insuranceSelect').innerHTML = '<option value="">-- 보험 선택 --</option>';
    document.getElementById('uploadFile').value = '';
    document.getElementById('uploadBackdrop').classList.add('open');
    if (searchVehicleNo) loadInsuranceList();
  }
  function closeUploadModal() { document.getElementById('uploadBackdrop').classList.remove('open'); }

  async function loadInsuranceList() {
    const vehicleNo = document.getElementById('uploadVehicleNo').value.trim();
    if (!vehicleNo) { alert('차량번호를 입력하세요.'); return; }

    const sel = document.getElementById('insuranceSelect');
    sel.innerHTML = '<option value="">조회 중...</option>';

    try {
      const res = await fetch(`${BASE}/api/insurances?vehicleNo=${encodeURIComponent(vehicleNo)}`, {credentials:'include'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const list = await res.json();

      if (!list.length) {
        sel.innerHTML = '<option value="">보험 데이터 없음</option>';
        document.getElementById('insuranceSelectField').style.display = 'block';
        return;
      }

      sel.innerHTML = '<option value="">-- 보험 선택 --</option>' +
        list.map(ins =>
          `<option value="${ins.id}" data-vehicleno="${esc(ins.vehicleNo||vehicleNo)}">
            ${esc(ins.insuranceStartDate||'')} ~ ${esc(ins.insuranceEndDate||'')}
            (${esc(ins.vehicleNo||vehicleNo)})
          </option>`
        ).join('');
      document.getElementById('insuranceSelectField').style.display = 'block';
    } catch(e) {
      sel.innerHTML = '<option value="">조회 실패</option>';
      alert('보험 조회 실패: ' + e.message);
    }
  }

  async function submitUpload() {
    const vehicleNo = document.getElementById('uploadVehicleNo').value.trim();
    const sel = document.getElementById('insuranceSelect');
    const insuranceId = sel.value;
    const file = document.getElementById('uploadFile').files[0];

    if (!vehicleNo) { alert('차량번호를 입력하세요.'); return; }
    if (!insuranceId) { alert('보험을 선택하세요.'); return; }
    if (!file) { alert('파일을 선택하세요.'); return; }
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','jpg','jpeg','png'].includes(ext)) { alert('PDF, JPG, JPEG, PNG만 가능합니다.'); return; }
    if (file.size > 10*1024*1024) { alert('최대 10MB까지 업로드 가능합니다.'); return; }

    const selectedOpt = sel.options[sel.selectedIndex];
    const storedVehicleNo = selectedOpt?.dataset?.vehicleno || vehicleNo;

    const form = new FormData();
    form.append('documentType', '보험증권');
    form.append('insuranceId', insuranceId);
    form.append('vehicleNo', storedVehicleNo);
    form.append('file', file);

    try {
      const res = await fetch(`${BASE}/api/documents/upload`, {method:'POST', body:form, credentials:'include'});
      if (!res.ok) { const b=await res.json().catch(()=>{}); throw new Error(b?.error||'HTTP '+res.status); }
      alert('업로드 완료!');
      closeUploadModal();
      // 검색창에 차량번호 설정 후 재조회
      document.getElementById('searchVehicleNo').value = vehicleNo;
      doSearch();
    } catch(e) { alert('업로드 실패: '+e.message); }
  }

  // ── 삭제 ────────────────────────────────────────
  async function deleteScan(id) {
    if (!confirm('이 파일을 삭제하시겠습니까?')) return;
    try {
      const res = await fetch(`${BASE}/api/documents/${id}`, {method:'DELETE', credentials:'include'});
      if (!res.ok) throw new Error('HTTP '+res.status);
      alert('삭제되었습니다.');
      doSearch();
    } catch(e) { alert('삭제 실패: '+e.message); }
  }

  // ── 뷰어 ────────────────────────────────────────
  function openViewer(id, fileName) {
    const url = `${BASE}/api/documents/${id}/view`;
    const ext = (fileName||'').split('.').pop().toLowerCase();
    document.getElementById('viewerTitle').textContent = fileName||'문서 보기';
    const body = document.getElementById('viewerBody');
    body.innerHTML = ['jpg','jpeg','png','gif','webp'].includes(ext)
      ? `<img src="${url}" alt="${esc(fileName)}">`
      : `<iframe src="${url}" title="${esc(fileName)}"></iframe>`;
    document.getElementById('viewerBackdrop').classList.add('open');
  }
  function closeViewer() {
    document.getElementById('viewerBackdrop').classList.remove('open');
    document.getElementById('viewerBody').innerHTML='';
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('viewerBackdrop').classList.contains('open')) { closeViewer(); return; }
    if (document.getElementById('uploadBackdrop').classList.contains('open')) { closeUploadModal(); return; }
  });
  ['uploadBackdrop','viewerBackdrop'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === document.getElementById(id)) {
        if (id==='uploadBackdrop') closeUploadModal();
        if (id==='viewerBackdrop') closeViewer();
      }
    });
  });
</script>
</body>
</html>
