<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량등록증 스캔 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .btn { padding: 8px 18px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.88rem; font-weight: 700; }
    .btn-primary   { background: #23304e; color: #fff; }
    .btn-primary:hover { background: #1b253a; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-add  { background: #3b82f6; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; }
    .btn-add:hover  { background: #2563eb; }
    .btn-del  { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; }
    .btn-del:hover  { background: #fed7d7; }
    .btn-view { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; }
    .btn-view:hover { background: #dcfce7; }

    /* 검색 카드 */
    .search-card {
      background: #fff; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 16px 20px; margin-bottom: 14px;
    }
    .search-row {
      display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
    }
    .sfg { display: flex; flex-direction: column; gap: 4px; }
    .sfg label { font-size: 0.8rem; font-weight: 700; color: #374151; }
    .sfg input[type="text"],
    .sfg input[type="date"] {
      padding: 8px 11px; border: 1px solid #d1d5db; border-radius: 5px;
      font-size: 0.9rem; outline: none; height: 36px; box-sizing: border-box;
    }
    .sfg input:focus { border-color: #23304e; }
    .sep { color: #9ca3af; align-self: flex-end; padding-bottom: 8px; font-size: 0.85rem; }

    /* 테이블 카드 */
    .table-card {
      background: #fff; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 16px 20px;
    }
    .card-header-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .card-title { font-size: 0.95rem; font-weight: 700; color: #1b253a; }
    .result-count { font-size: 0.82rem; color: #6b7280; }

    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-top: 2px solid #23304e; border-bottom: 2px solid #e5e7eb; }
    th { padding: 9px 10px; font-size: 0.8rem; font-weight: 700; color: #374151; background: #f8fafc; white-space: nowrap; text-align: center; }
    th.l { text-align: left; }
    td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.87rem; color: #374151; white-space: nowrap; text-align: center; }
    td.l { text-align: left; }
    tr:hover td { background: #f9fafb; }
    .empty-row td { text-align: center; color: #9ca3af; padding: 32px; }

    /* 스캔 배지 */
    .scan-y { display: inline-block; background: #dbeafe; color: #1d4ed8; border-radius: 4px; padding: 2px 8px; font-size: 0.76rem; font-weight: 700; }
    .scan-n { display: inline-block; background: #fee2e2; color: #b91c1c; border-radius: 4px; padding: 2px 8px; font-size: 0.76rem; font-weight: 700; }

    /* 업로드 모달 */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9999; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 28px; width: min(480px, 96vw); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .modal-box h3 { margin: 0 0 6px; font-size: 1.05rem; font-weight: 800; color: #1b253a; }
    .modal-sub { color: #6b7280; font-size: 0.82rem; margin-bottom: 18px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 0.82rem; font-weight: 700; color: #374151; margin-bottom: 5px; }
    .modal-field input[type="text"],
    .modal-field input[type="file"] {
      width: 100%; box-sizing: border-box;
      padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 0.9rem; outline: none;
    }
    .modal-field input:focus { border-color: #23304e; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal-btns .btn-cancel { padding: 9px 18px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
    .modal-btns .btn-cancel:hover { background: #e5e7eb; }
    .modal-btns .btn-ok { padding: 9px 22px; background: #23304e; color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
    .modal-btns .btn-ok:hover { background: #1b253a; }

    /* 스캔 목록 모달 (차량별 업로드 파일 목록) */
    .scan-list-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9999; align-items: center; justify-content: center; }
    .scan-list-modal.open { display: flex; }
    .scan-list-box { background: #fff; border-radius: 12px; width: min(680px, 96vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; }
    .scan-list-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eee; }
    .scan-list-title { font-weight: 700; font-size: 1rem; color: #111827; }
    .scan-list-close { border: 1px solid #ddd; background: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .scan-list-close:hover { background: #f5f5f5; }
    .scan-list-body { flex: 1; overflow-y: auto; padding: 16px; }
    .scan-list-footer { padding: 12px 18px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; }

    /* 뷰어 모달 */
    .viewer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 10000; align-items: center; justify-content: center; }
    .viewer-backdrop.open { display: flex; }
    .viewer-box { background: #fff; border-radius: 12px; width: min(860px, 96vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden; }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eee; }
    .viewer-title { font-weight: 700; font-size: 1rem; color: #111827; }
    .viewer-close { border: 1px solid #ddd; background: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .viewer-close:hover { background: #f5f5f5; }
    .viewer-body { flex: 1; overflow: auto; padding: 16px; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
    .viewer-body img { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 4px; }
    .viewer-body iframe { width: 100%; height: 70vh; border: none; }
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="content-wrapper">
  <div class="page-header">
    <h1>차량등록증 스캔</h1>
    <p>차량관리 &gt; 스캔관리 &gt; 차량등록증</p>
  </div>

  <!-- 검색 -->
  <div class="search-card">
    <div class="search-row">
      <div class="sfg">
        <label>차량등록기간</label>
        <input type="date" id="regStart">
      </div>
      <span class="sep">~</span>
      <div class="sfg">
        <label>&nbsp;</label>
        <input type="date" id="regEnd">
      </div>
      <div class="sfg">
        <label>차량번호</label>
        <input type="text" id="searchVehicleNo" placeholder="12가3456" style="width:130px;"
               onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="sfg">
        <label>차량관리번호</label>
        <input type="text" id="searchMgmtNo" placeholder="관리번호" style="width:130px;"
               onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <button class="btn btn-primary" onclick="doSearch()">조회</button>
    </div>
  </div>

  <!-- 테이블 -->
  <div class="table-card">
    <div class="card-header-row">
      <span class="card-title">차량 목록</span>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:44px;">번호</th>
            <th>차량관리번호</th>
            <th>차량번호</th>
            <th>차종</th>
            <th>차량등록일</th>
            <th>발주상태</th>
            <th style="width:80px;">스캔유무</th>
            <th style="width:140px;">관리</th>
          </tr>
        </thead>
        <tbody id="scanTableBody">
          <tr class="empty-row"><td colspan="8">등록기간을 선택하고 조회하세요.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 업로드 모달 -->
<div class="modal-backdrop" id="uploadBackdrop">
  <div class="modal-box">
    <h3>차량등록증 업로드</h3>
    <p class="modal-sub" id="uploadSubTitle"></p>
    <div class="modal-field">
      <label>파일 선택 <span style="color:#6b7280; font-weight:400;">(PDF/JPG/JPEG/PNG, 최대 10MB)</span></label>
      <input type="file" id="uploadFile" accept=".pdf,.jpg,.jpeg,.png">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeUploadModal()">취소</button>
      <button class="btn-ok" onclick="submitUpload()">업로드</button>
    </div>
  </div>
</div>

<!-- 스캔 목록 모달 (차량별 등록된 스캔 파일 목록) -->
<div class="scan-list-modal" id="scanListModal">
  <div class="scan-list-box">
    <div class="scan-list-header">
      <span class="scan-list-title" id="scanListTitle">스캔 파일 목록</span>
      <button class="scan-list-close" onclick="closeScanListModal()">✕</button>
    </div>
    <div class="scan-list-body">
      <table>
        <thead>
          <tr>
            <th style="width:36px;">#</th>
            <th class="l">파일명</th>
            <th>크기</th>
            <th>업로드일시</th>
            <th style="width:110px;">관리</th>
          </tr>
        </thead>
        <tbody id="scanListBody">
          <tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="scan-list-footer">
      <button class="btn-cancel" onclick="closeScanListModal()" style="padding:8px 18px; background:#f3f4f6; border:1px solid #d1d5db; border-radius:6px; font-weight:600; cursor:pointer;">닫기</button>
    </div>
  </div>
</div>

<!-- 뷰어 모달 -->
<div class="viewer-backdrop" id="viewerBackdrop">
  <div class="viewer-box">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerTitle">문서 보기</span>
      <button class="viewer-close" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</div>

<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/config.js"></script>
<script>
  const BASE = (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '').replace(/\/+$/, '');

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmtSize(b) {
    if (!b) return '-';
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    return (b/1024/1024).toFixed(1) + ' MB';
  }
  function fmtDt(dt) {
    return dt ? String(dt).replace('T',' ').substring(0,16) : '-';
  }

  // 업로드 중인 차량 정보
  let _uploadMgmtNo = '';
  let _uploadVehicleNo = '';
  // 스캔 목록 모달용 차량 정보
  let _listMgmtNo = '';

  // ── 전체 조회 ──────────────────────────────────────────────
  async function doSearch() {
    const regStart    = document.getElementById('regStart').value;
    const regEnd      = document.getElementById('regEnd').value;
    const vehicleNo   = document.getElementById('searchVehicleNo').value.trim();
    const mgmtNo      = document.getElementById('searchMgmtNo').value.trim();

    const tbody = document.getElementById('scanTableBody');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">조회 중...</td></tr>';
    document.getElementById('resultCount').textContent = '';

    try {
      // 1) 차량 목록 조회 (등록기간 or 번호 기준)
      const qs = new URLSearchParams();
      if (regStart) qs.set('registerDateStart', regStart);
      if (regEnd)   qs.set('registerDateEnd',   regEnd);

      const vRes = await fetch(`${BASE}/api/vehicle-orders?${qs.toString()}`, { credentials: 'include' });
      if (!vRes.ok) throw new Error('HTTP ' + vRes.status);
      let vehicles = await vRes.json();

      // 번호 필터 (클라이언트)
      if (vehicleNo) vehicles = vehicles.filter(v =>
        (v.vehicleNo || '').toLowerCase().includes(vehicleNo.toLowerCase()));
      if (mgmtNo) vehicles = vehicles.filter(v =>
        (v.vehicleMgmtNo || '').toLowerCase().includes(mgmtNo.toLowerCase()));

      if (!vehicles.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">조회 결과가 없습니다.</td></tr>';
        document.getElementById('resultCount').textContent = '0건';
        return;
      }

      // 2) 스캔 문서 전체 조회 (차량등록증)
      const docRes = await fetch(`${BASE}/api/documents?documentType=차량등록증`, { credentials: 'include' });
      let scanDocs = [];
      if (docRes.ok) scanDocs = await docRes.json();

      // mgmtNo 기준 스캔 여부 Map 생성
      const scanMap = {};   // mgmtNo → true/false
      const docCountMap = {}; // mgmtNo → 파일 수
      scanDocs.forEach(d => {
        const key = d.vehicleMgmtNo || d.vehicleNo || '';
        if (key) { scanMap[key] = true; docCountMap[key] = (docCountMap[key] || 0) + 1; }
      });

      // 3) 렌더링
      document.getElementById('resultCount').textContent = vehicles.length + '건';
      tbody.innerHTML = vehicles.map((v, i) => {
        const key = v.vehicleMgmtNo || '';
        const hasScan = !!scanMap[key];
        const cnt = docCountMap[key] || 0;
        return `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(v.vehicleMgmtNo || '-')}</td>
          <td>${esc(v.vehicleNo || '-')}</td>
          <td class="l">${esc(v.carModel || '-')}</td>
          <td>${esc(v.registerDate || '-')}</td>
          <td>${esc(v.orderStatus || '-')}</td>
          <td>
            ${hasScan
              ? `<span class="scan-y">스캔 유(${cnt})</span>`
              : '<span class="scan-n">스캔 무</span>'}
          </td>
          <td>
            ${hasScan
              ? `<button class="btn-view" onclick="openScanList('${esc(v.vehicleMgmtNo)}','${esc(v.vehicleNo||'')}')">목록</button>&nbsp;`
              : ''}
            <button class="btn-add" onclick="openUploadModal('${esc(v.vehicleMgmtNo)}','${esc(v.vehicleNo||'')}')">업로드</button>
          </td>
        </tr>`;
      }).join('');

    } catch (e) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8" style="color:#ef4444;">오류: ${esc(e.message)}</td></tr>`;
    }
  }

  // ── 업로드 모달 ───────────────────────────────────────────
  function openUploadModal(mgmtNo, vehicleNo) {
    _uploadMgmtNo   = mgmtNo;
    _uploadVehicleNo = vehicleNo;
    document.getElementById('uploadSubTitle').textContent =
      '차량관리번호: ' + (mgmtNo || '-') + (vehicleNo ? '  /  차량번호: ' + vehicleNo : '');
    document.getElementById('uploadFile').value = '';
    document.getElementById('uploadBackdrop').classList.add('open');
  }
  function closeUploadModal() {
    document.getElementById('uploadBackdrop').classList.remove('open');
  }

  async function submitUpload() {
    const file = document.getElementById('uploadFile').files[0];
    if (!file) { alert('파일을 선택하세요.'); return; }
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','jpg','jpeg','png'].includes(ext)) { alert('PDF, JPG, JPEG, PNG 파일만 가능합니다.'); return; }
    if (file.size > 10 * 1024 * 1024) { alert('최대 10MB까지 업로드 가능합니다.'); return; }

    const form = new FormData();
    form.append('documentType', '차량등록증');
    if (_uploadMgmtNo)   form.append('vehicleMgmtNo', _uploadMgmtNo);
    if (_uploadVehicleNo) form.append('vehicleNo',    _uploadVehicleNo);
    form.append('file', file);

    try {
      const res = await fetch(`${BASE}/api/documents/upload`, { method: 'POST', body: form, credentials: 'include' });
      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try { const b = await res.json(); msg = b.message || b.error || msg; } catch(e) {}
        throw new Error(msg);
      }
      alert('업로드 완료!');
      closeUploadModal();
      doSearch();
    } catch (e) {
      alert('업로드 실패: ' + e.message);
    }
  }

  // ── 스캔 목록 모달 ────────────────────────────────────────
  async function openScanList(mgmtNo, vehicleNo) {
    _listMgmtNo = mgmtNo;
    document.getElementById('scanListTitle').textContent =
      '스캔 파일 목록 — ' + (mgmtNo || '-') + (vehicleNo ? ' / ' + vehicleNo : '');
    document.getElementById('scanListBody').innerHTML =
      '<tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>';
    document.getElementById('scanListModal').classList.add('open');
    await loadScanList(mgmtNo);
  }
  function closeScanListModal() {
    document.getElementById('scanListModal').classList.remove('open');
  }

  async function loadScanList(mgmtNo) {
    const qs = new URLSearchParams({ documentType: '차량등록증', vehicleMgmtNo: mgmtNo });
    try {
      const res = await fetch(`${BASE}/api/documents?${qs.toString()}`, { credentials: 'include' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const list = await res.json();
      const tbody = document.getElementById('scanListBody');
      if (!list.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">파일 없음</td></tr>';
        return;
      }
      tbody.innerHTML = list.map((d, i) => `
        <tr>
          <td>${i + 1}</td>
          <td class="l">${esc(d.fileName || '-')}</td>
          <td>${fmtSize(d.fileSize)}</td>
          <td>${fmtDt(d.uploadedAt)}</td>
          <td>
            <button class="btn-view" onclick="openViewer(${d.id},'${esc(d.fileName)}')">보기</button>&nbsp;
            <button class="btn-del" onclick="deleteScan(${d.id},'${esc(mgmtNo)}')">삭제</button>
          </td>
        </tr>`).join('');
    } catch (e) {
      document.getElementById('scanListBody').innerHTML =
        `<tr class="empty-row"><td colspan="5" style="color:#ef4444;">오류: ${esc(e.message)}</td></tr>`;
    }
  }

  // ── 삭제 ──────────────────────────────────────────────────
  async function deleteScan(id, mgmtNo) {
    if (!confirm('이 파일을 삭제하시겠습니까?')) return;
    try {
      const res = await fetch(`${BASE}/api/documents/${id}`, { method: 'DELETE', credentials: 'include' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      alert('삭제되었습니다.');
      // 목록 모달이 열려 있으면 새로고침, 아니면 목록 재조회
      if (document.getElementById('scanListModal').classList.contains('open')) {
        await loadScanList(mgmtNo || _listMgmtNo);
      }
      doSearch();
    } catch (e) {
      alert('삭제 실패: ' + e.message);
    }
  }

  // ── 뷰어 ──────────────────────────────────────────────────
  function openViewer(id, fileName) {
    const url = `${BASE}/api/documents/${id}/view`;
    const ext = (fileName || '').split('.').pop().toLowerCase();
    const body = document.getElementById('viewerBody');
    document.getElementById('viewerTitle').textContent = fileName || '문서 보기';
    body.innerHTML = ['jpg','jpeg','png','gif','webp'].includes(ext)
      ? `<img src="${url}" alt="${esc(fileName)}">`
      : `<iframe src="${url}" title="${esc(fileName)}"></iframe>`;
    document.getElementById('viewerBackdrop').classList.add('open');
  }
  function closeViewer() {
    document.getElementById('viewerBackdrop').classList.remove('open');
    document.getElementById('viewerBody').innerHTML = '';
  }

  // ── ESC / 바깥 클릭 ───────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('viewerBackdrop').classList.contains('open'))   { closeViewer(); return; }
    if (document.getElementById('scanListModal').classList.contains('open'))    { closeScanListModal(); return; }
    if (document.getElementById('uploadBackdrop').classList.contains('open'))   { closeUploadModal(); return; }
  });
  ['uploadBackdrop','viewerBackdrop','scanListModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === document.getElementById(id)) {
        if (id === 'uploadBackdrop')  closeUploadModal();
        if (id === 'viewerBackdrop')  closeViewer();
        if (id === 'scanListModal')   closeScanListModal();
      }
    });
  });

  // ── 초기 로드: 이번달 기본 세팅 ──────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    const y   = now.getFullYear();
    const m   = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('regStart').value = `${y}-${m}-01`;
    document.getElementById('regEnd').value   = new Date(y, now.getMonth()+1, 0)
      .toISOString().slice(0, 10);
    doSearch();
  });
</script>
</body>
</html>
