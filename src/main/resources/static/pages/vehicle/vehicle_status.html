<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량현황 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/vehicle/vehicle_status.css">
  <style>
    /* 운용구분 배지 / 매각 상태 / 보유현황 요약 */
    .op-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .op-long { background-color: #dbeafe; color: #1e40af; }
    .op-short { background-color: #fef3c7; color: #92400e; }
    .status-sold { background-color: #e5e7eb; color: #374151; }
    tr.row-sold td { color: #4b5563; background-color: #f9fafb; }
    .checkbox-group { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 10px; }
    .checkbox-group input { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    .checkbox-group label { cursor: pointer; }
    .vehicle-summary { margin: 0 0 10px; font-size: 13px; color: #334155; }
    .vehicle-summary strong { color: #1e293b; }
    .vehicle-summary .summary-sep { color: #4b5563; margin: 0 6px; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>차량현황</h1>
      <p>차량등록 &gt; 차량현황</p>
    </div>

    <div class="erp-card">
      <div class="card-body">
        <!-- 검색 섹션 -->
        <div class="search-section">
          <div class="search-row">
            <div class="form-group">
              <label for="searchStartDate">발주일자</label>
              <div class="date-range">
                <input type="date" id="searchStartDate">
                <span>~</span>
                <input type="date" id="searchEndDate">
              </div>
            </div>
            <div class="form-group">
              <label for="searchStatus">발주상태</label>
              <select id="searchStatus">
                <option value="">전체</option>
                <option value="발주전">발주전</option>
                <option value="발주완료">발주완료</option>
                <option value="출고완료">출고완료</option>
                <option value="등록완료">등록완료</option>
                <option value="실행완료">실행완료</option>
                <option value="매각">매각</option>
              </select>
            </div>
            <div class="form-group">
              <label for="searchOperationType">운용구분</label>
              <select id="searchOperationType" onchange="renderFiltered()">
                <option value="">전체</option>
                <option value="장기">장기</option>
                <option value="단기">단기</option>
                <option value="__none__">미지정</option>
              </select>
            </div>
            <div class="form-group">
              <label for="searchBranch">소속지점</label>
              <select id="searchBranch" onchange="renderFiltered()">
                <option value="">전체</option>
                <option value="본점">본점</option>
                <option value="천안지점">천안지점</option>
                <option value="__none__">미지정</option>
              </select>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="includeSold" onchange="renderFiltered()">
              <label for="includeSold">매각 차량 포함</label>
            </div>
            <div class="button-group">
              <button type="button" class="btn-search" onclick="searchVehicle()">조회하기</button>
              <button type="button" class="btn-add" onclick="goToRegister()">+ 등록추가</button>
              <button type="button" class="btn-excel" onclick="exportTableToExcel('vehicleTableBody', '차량현황')">엑셀 내보내기</button>
            </div>
          </div>
        </div>

        <!-- 보유현황 요약 -->
        <p class="vehicle-summary" id="vehicleSummary" aria-live="polite"></p>

        <!-- 테이블 -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>순번</th>
                <th>발주상태</th>
                <th>차량관리번호</th>
                <th>제작사계약번호</th>
                <th>차종</th>
                <th>옵션명</th>
                <th>차량가격</th>
                <th>옵션가격</th>
                <th>총차량가</th>
                <th>발주일자</th>
                <th>차대번호</th>
                <th>출고가</th>
                <th>총 선급가액</th>
                <th>차량번호</th>
                <th>운용구분</th>
                <th>소속지점</th>
                <th>등록일자</th>
              </tr>
            </thead>
            <tbody id="vehicleTableBody">
              <tr>
                <td colspan="17" class="no-data">조회하기를 눌러 데이터를 불러오세요.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/html-escape.js"></script>
  <script>
    const API_BASE = '/api/vehicle-orders';
    let allVehicles = []; // 마지막 조회 결과 (클라이언트 필터 기준)

    window.addEventListener('DOMContentLoaded', function() {
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      document.getElementById('searchStartDate').value = firstDay.toISOString().split('T')[0];
      document.getElementById('searchEndDate').value = today.toISOString().split('T')[0];
      searchVehicle();
    });

    async function searchVehicle() {
      const tbody = document.getElementById('vehicleTableBody');
      try {
        const startDate = document.getElementById('searchStartDate').value;
        const endDate = document.getElementById('searchEndDate').value;
        const status = document.getElementById('searchStatus').value;

        const url = new URL(API_BASE, window.location.origin);
        if (startDate) url.searchParams.set('startDate', startDate);
        if (endDate) url.searchParams.set('endDate', endDate);
        if (status) url.searchParams.set('status', status);

        const res = await fetch(url.toString(), { credentials: 'include' });
        if (!res.ok) {
          allVehicles = [];
          document.getElementById('vehicleSummary').textContent = '';
          tbody.innerHTML = `<tr><td colspan="17" class="no-data">조회 실패: ${res.status}</td></tr>`;
          return;
        }
        const data = await res.json();
        allVehicles = Array.isArray(data) ? data : [];
        renderFiltered();
      } catch (error) {
        console.error('조회 오류:', error);
        allVehicles = [];
        document.getElementById('vehicleSummary').textContent = '';
        tbody.innerHTML = `<tr><td colspan="17" class="no-data">조회 중 오류가 발생했습니다.</td></tr>`;
      }
    }

    function getStatusClass(status) {
      switch(status) {
        case '발주전': return 'status-before';
        case '발주완료': return 'status-ordered';
        case '출고완료': return 'status-released';
        case '등록완료': return 'status-registered';
        case '실행완료': return 'status-executed';
        case '매각': return 'status-sold';
        default: return '';
      }
    }

    function isBlank(v) {
      return v === null || v === undefined || String(v).trim() === '';
    }

    // 운용구분/소속지점 필터 매칭 ('' = 전체, '__none__' = 미지정)
    function matchFilter(value, filter) {
      if (!filter) return true;
      if (filter === '__none__') return isBlank(value);
      return !isBlank(value) && String(value).trim() === filter;
    }

    function getOperationBadge(type) {
      if (isBlank(type)) return '-';
      const cls = type === '장기' ? 'op-long' : (type === '단기' ? 'op-short' : '');
      return `<span class="op-badge ${cls}">${escHtml(type)}</span>`;
    }

    // 클라이언트 필터 적용 후 렌더링 (엑셀 내보내기는 tbody 기준이라 보이는 행만 출력됨)
    function renderFiltered() {
      const opFilter = document.getElementById('searchOperationType').value;
      const branchFilter = document.getElementById('searchBranch').value;
      const includeSold = document.getElementById('includeSold').checked;

      const byAttr = allVehicles.filter(v =>
        matchFilter(v.operationType, opFilter) && matchFilter(v.branch, branchFilter));
      const soldCount = byAttr.filter(v => v.orderStatus === '매각').length;
      const ownedCount = byAttr.length - soldCount;
      const visible = includeSold ? byAttr : byAttr.filter(v => v.orderStatus !== '매각');

      let longCnt = 0, shortCnt = 0, noneCnt = 0;
      visible.forEach(v => {
        if (v.operationType === '장기') longCnt++;
        else if (v.operationType === '단기') shortCnt++;
        else noneCnt++;
      });

      document.getElementById('vehicleSummary').innerHTML =
        `보유 <strong>${ownedCount}</strong>대 · 매각 <strong>${soldCount}</strong>대(${includeSold ? '표시' : '숨김'})` +
        `<span class="summary-sep">|</span>` +
        `장기 <strong>${longCnt}</strong> · 단기 <strong>${shortCnt}</strong> · 미지정 <strong>${noneCnt}</strong>`;

      displayVehicle(visible);
    }

    function fmt(n) {
      if (n === null || n === undefined || n === '') return '-';
      const num = Number(n);
      return isNaN(num) ? '-' : num.toLocaleString();
    }

    function displayVehicle(data) {
      const tbody = document.getElementById('vehicleTableBody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="17" class="no-data">검색 결과가 없습니다.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map((item, index) => {
        const statusLabel = item.orderStatus ?? '-';
        const statusClass = getStatusClass(statusLabel);
        return `
          <tr class="${item.orderStatus === '매각' ? 'row-sold' : ''}" onclick="viewDetail('${item.id}')">
            <td>${index + 1}</td>
            <td><span class="status-badge ${statusClass}">${escHtml(statusLabel)}</span></td>
            <td>${escHtml(item.vehicleMgmtNo ?? '-')}</td>
            <td>${escHtml(item.makerContractNo ?? '-')}</td>
            <td>${escHtml(item.carModel ?? '-')}</td>
            <td>${escHtml(item.optionName ?? '-')}</td>
            <td class="amount-cell">${fmt(item.vehiclePrice)}</td>
            <td class="amount-cell">${item.optionPrice ? fmt(item.optionPrice) : '-'}</td>
            <td class="amount-cell">${fmt(item.totalPrice)}</td>
            <td>${item.orderDate ?? '-'}</td>
            <td>${escHtml(item.chassisNo ?? '-')}</td>
            <td class="amount-cell">${item.releasePrice ? fmt(item.releasePrice) : '-'}</td>
            <td class="amount-cell">${item.totalAdvancePrice ? fmt(item.totalAdvancePrice) : '-'}</td>
            <td>${escHtml(item.vehicleNo ?? '-')}</td>
            <td>${getOperationBadge(item.operationType)}</td>
            <td>${isBlank(item.branch) ? '-' : escHtml(item.branch)}</td>
            <td>${item.registerDate ?? '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function goToRegister() {
      window.location.href = 'vehicle_order.html';
    }

    // Phase 2 v5: 상세 이동은 행 PK(id) 기반 (…000 공유값 대비)
    function viewDetail(rowId) {
      window.location.href = 'vehicle_detail.html?id=' + encodeURIComponent(rowId);
    }
  </script>
  <script src="../../assets/js/excel-export.js"></script>
</body>
</html>
