<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량현황 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/vehicle/vehicle_status.css">
  <style>
    /* 운용구분 배지 / 매각 상태 / 보유현황 요약 */
    .op-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .op-long { background-color: #dbeafe; color: #1e40af; }
    .op-short { background-color: #fef3c7; color: #92400e; }
    .status-sold { background-color: #e5e7eb; color: #374151; }
    tr.row-sold td { color: #4b5563; background-color: #f9fafb; }
    .checkbox-group { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 10px; }
    .checkbox-group input { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    .checkbox-group label { cursor: pointer; }
    .vehicle-summary { margin: 0 0 10px; font-size: 13px; color: #334155; }
    .vehicle-summary strong { color: #1e293b; }
    .vehicle-summary .summary-sep { color: #4b5563; margin: 0 6px; }
    /* 운용구분·소속지점 바로 변경 */
    .attr-edit { display: flex; gap: 4px; }
    .attr-edit select { padding: 3px 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; color: #1e293b; }
    .attr-edit select.saving { opacity: .5; }
    .attr-edit select.saved { border-color: #15803d; }
    .bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; padding: 8px 10px;
                background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; color: #1e293b; }
    .bulk-bar select { padding: 4px 6px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .bulk-bar button { padding: 5px 12px; font-size: 13px; border-radius: 4px; border: 1px solid #1e3a8a; background: #1e3a8a; color: #fff; cursor: pointer; }
    .bulk-bar button:disabled { opacity: .45; cursor: default; }
    .bulk-bar .bulk-msg { color: #334155; }
    td.sel-cell, th.sel-cell { width: 32px; text-align: center; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>차량현황</h1>
      <p>차량등록 &gt; 차량현황</p>
    </div>

    <div class="erp-card">
      <div class="card-body">
        <!-- 검색 섹션 -->
        <div class="search-section">
          <div class="search-row">
            <div class="form-group">
              <label for="searchStartDate">발주일자</label>
              <div class="date-range">
                <input type="date" id="searchStartDate">
                <span>~</span>
                <input type="date" id="searchEndDate">
              </div>
            </div>
            <div class="form-group">
              <label for="searchStatus">발주상태</label>
              <select id="searchStatus">
                <option value="">전체</option>
                <option value="발주전">발주전</option>
                <option value="발주완료">발주완료</option>
                <option value="출고완료">출고완료</option>
                <option value="등록완료">등록완료</option>
                <option value="실행완료">실행완료</option>
                <option value="매각">매각</option>
              </select>
            </div>
            <div class="form-group">
              <label for="searchOperationType">운용구분</label>
              <select id="searchOperationType" onchange="renderFiltered()">
                <option value="">전체</option>
                <option value="장기">장기</option>
                <option value="단기">단기</option>
                <option value="__none__">미지정</option>
              </select>
            </div>
            <div class="form-group">
              <label for="searchBranch">소속지점</label>
              <select id="searchBranch" onchange="renderFiltered()">
                <option value="">전체</option>
                <option value="본점">본점</option>
                <option value="천안지점">천안지점</option>
                <option value="__none__">미지정</option>
              </select>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="includeSold" onchange="renderFiltered()">
              <label for="includeSold">매각 차량 포함</label>
            </div>
            <div class="button-group">
              <button type="button" class="btn-search" onclick="searchVehicle()">조회하기</button>
              <button type="button" class="btn-add" onclick="goToRegister()">+ 등록추가</button>
              <button type="button" class="btn-excel" onclick="exportTableToExcel('vehicleTableBody', '차량현황')">엑셀 내보내기</button>
            </div>
          </div>
        </div>

        <!-- 보유현황 요약 -->
        <p class="vehicle-summary" id="vehicleSummary" aria-live="polite"></p>

        <!-- 선택 차량 일괄 변경 (단기 차량이 장기로 나가는 경우 등) -->
        <div class="bulk-bar">
          <span>선택 <strong id="bulkCount">0</strong>대</span>
          <label for="bulkOperationType">운용구분</label>
          <select id="bulkOperationType">
            <option value="__keep__">변경 안 함</option>
            <option value="장기">장기</option>
            <option value="단기">단기</option>
            <option value="">미지정</option>
          </select>
          <label for="bulkBranch">소속지점</label>
          <select id="bulkBranch">
            <option value="__keep__">변경 안 함</option>
            <option value="본점">본점</option>
            <option value="천안지점">천안지점</option>
            <option value="">미지정</option>
          </select>
          <button type="button" id="bulkApplyBtn" onclick="applyBulk()" disabled>선택 차량에 적용</button>
          <span class="bulk-msg" id="bulkMsg" aria-live="polite"></span>
        </div>

        <!-- 테이블 -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sel-cell no-export"><input type="checkbox" id="selectAll" onclick="event.stopPropagation(); toggleAll(this.checked)" aria-label="전체 선택"></th>
                <th>순번</th>
                <th>발주상태</th>
                <th>차량관리번호</th>
                <th>제작사계약번호</th>
                <th>차종</th>
                <th>옵션명</th>
                <th>차량가격</th>
                <th>옵션가격</th>
                <th>총차량가</th>
                <th>발주일자</th>
                <th>차대번호</th>
                <th>출고가</th>
                <th>총 선급가액</th>
                <th>차량번호</th>
                <th>운용구분</th>
                <th>소속지점</th>
                <th>등록일자</th>
                <th class="no-export">운용구분·지점 변경</th>
              </tr>
            </thead>
            <tbody id="vehicleTableBody">
              <tr>
                <td colspan="19" class="no-data">조회하기를 눌러 데이터를 불러오세요.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/html-escape.js"></script>
  <script>
    const API_BASE = '/api/vehicle-orders';
    let allVehicles = []; // 마지막 조회 결과 (클라이언트 필터 기준)

    // 처음 열면 발주일자 조건 없이 보유 차량 전체를 보여준다(발주일자는 필요할 때만 지정)
    window.addEventListener('DOMContentLoaded', function() {
      searchVehicle();
    });

    async function searchVehicle() {
      const tbody = document.getElementById('vehicleTableBody');
      try {
        const startDate = document.getElementById('searchStartDate').value;
        const endDate = document.getElementById('searchEndDate').value;
        const status = document.getElementById('searchStatus').value;

        const url = new URL(API_BASE, window.location.origin);
        if (startDate) url.searchParams.set('startDate', startDate);
        if (endDate) url.searchParams.set('endDate', endDate);
        if (status) url.searchParams.set('status', status);

        const res = await fetch(url.toString(), { credentials: 'include' });
        if (!res.ok) {
          allVehicles = [];
          document.getElementById('vehicleSummary').textContent = '';
          tbody.innerHTML = `<tr><td colspan="19" class="no-data">조회 실패: ${res.status}</td></tr>`;
          return;
        }
        const data = await res.json();
        allVehicles = Array.isArray(data) ? data : [];
        renderFiltered();
      } catch (error) {
        console.error('조회 오류:', error);
        allVehicles = [];
        document.getElementById('vehicleSummary').textContent = '';
        tbody.innerHTML = `<tr><td colspan="19" class="no-data">조회 중 오류가 발생했습니다.</td></tr>`;
      }
    }

    function getStatusClass(status) {
      switch(status) {
        case '발주전': return 'status-before';
        case '발주완료': return 'status-ordered';
        case '출고완료': return 'status-released';
        case '등록완료': return 'status-registered';
        case '실행완료': return 'status-executed';
        case '매각': return 'status-sold';
        default: return '';
      }
    }

    function isBlank(v) {
      return v === null || v === undefined || String(v).trim() === '';
    }

    // 운용구분/소속지점 필터 매칭 ('' = 전체, '__none__' = 미지정)
    function matchFilter(value, filter) {
      if (!filter) return true;
      if (filter === '__none__') return isBlank(value);
      return !isBlank(value) && String(value).trim() === filter;
    }

    function getOperationBadge(type) {
      if (isBlank(type)) return '-';
      const cls = type === '장기' ? 'op-long' : (type === '단기' ? 'op-short' : '');
      return `<span class="op-badge ${cls}">${escHtml(type)}</span>`;
    }

    // 클라이언트 필터 적용 후 렌더링 (엑셀 내보내기는 tbody 기준이라 보이는 행만 출력됨)
    function renderFiltered() {
      const opFilter = document.getElementById('searchOperationType').value;
      const branchFilter = document.getElementById('searchBranch').value;
      const includeSold = document.getElementById('includeSold').checked;

      const byAttr = allVehicles.filter(v =>
        matchFilter(v.operationType, opFilter) && matchFilter(v.branch, branchFilter));
      const soldCount = byAttr.filter(v => v.orderStatus === '매각').length;
      const ownedCount = byAttr.length - soldCount;
      const visible = includeSold ? byAttr : byAttr.filter(v => v.orderStatus !== '매각');

      let longCnt = 0, shortCnt = 0, noneCnt = 0;
      visible.forEach(v => {
        if (v.operationType === '장기') longCnt++;
        else if (v.operationType === '단기') shortCnt++;
        else noneCnt++;
      });

      document.getElementById('vehicleSummary').innerHTML =
        `보유 <strong>${ownedCount}</strong>대 · 매각 <strong>${soldCount}</strong>대(${includeSold ? '표시' : '숨김'})` +
        `<span class="summary-sep">|</span>` +
        `장기 <strong>${longCnt}</strong> · 단기 <strong>${shortCnt}</strong> · 미지정 <strong>${noneCnt}</strong>`;

      displayVehicle(visible);
    }

    function fmt(n) {
      if (n === null || n === undefined || n === '') return '-';
      const num = Number(n);
      return isNaN(num) ? '-' : num.toLocaleString();
    }

    function displayVehicle(data) {
      const tbody = document.getElementById('vehicleTableBody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="19" class="no-data">검색 결과가 없습니다.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map((item, index) => {
        const statusLabel = item.orderStatus ?? '-';
        const statusClass = getStatusClass(statusLabel);
        return `
          <tr class="${item.orderStatus === '매각' ? 'row-sold' : ''}" onclick="viewDetail('${item.id}')">
            <td class="sel-cell no-export" onclick="event.stopPropagation()">
              <input type="checkbox" class="row-sel" value="${item.id}" ${selectedIds.has(String(item.id)) ? 'checked' : ''}
                     onchange="onRowSelect(this)" aria-label="선택">
            </td>
            <td>${index + 1}</td>
            <td><span class="status-badge ${statusClass}">${escHtml(statusLabel)}</span></td>
            <td>${escHtml(item.vehicleMgmtNo ?? '-')}</td>
            <td>${escHtml(item.makerContractNo ?? '-')}</td>
            <td>${escHtml(item.carModel ?? '-')}</td>
            <td>${escHtml(item.optionName ?? '-')}</td>
            <td class="amount-cell">${fmt(item.vehiclePrice)}</td>
            <td class="amount-cell">${item.optionPrice ? fmt(item.optionPrice) : '-'}</td>
            <td class="amount-cell">${fmt(item.totalPrice)}</td>
            <td>${item.orderDate ?? '-'}</td>
            <td>${escHtml(item.chassisNo ?? '-')}</td>
            <td class="amount-cell">${item.releasePrice ? fmt(item.releasePrice) : '-'}</td>
            <td class="amount-cell">${item.totalAdvancePrice ? fmt(item.totalAdvancePrice) : '-'}</td>
            <td>${escHtml(item.vehicleNo ?? '-')}</td>
            <td>${getOperationBadge(item.operationType)}</td>
            <td>${isBlank(item.branch) ? '-' : escHtml(item.branch)}</td>
            <td>${item.registerDate ?? '-'}</td>
            <td class="no-export" onclick="event.stopPropagation()">
              <div class="attr-edit">
                <select aria-label="운용구분 변경" onchange="saveAttr(${item.id}, 'operationType', this)">
                  ${attrOptions(['장기', '단기'], item.operationType)}
                </select>
                <select aria-label="소속지점 변경" onchange="saveAttr(${item.id}, 'branch', this)">
                  ${attrOptions(['본점', '천안지점'], item.branch)}
                </select>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      updateBulkBar();
    }

    // ── 운용구분·소속지점 바로 변경 / 선택 차량 일괄 변경 ──
    const selectedIds = new Set();

    function attrOptions(values, current) {
      const cur = isBlank(current) ? '' : String(current).trim();
      const list = cur && !values.includes(cur) ? [...values, cur] : values;
      return `<option value="" ${cur === '' ? 'selected' : ''}>미지정</option>` +
        list.map(v => `<option value="${escHtml(v)}" ${v === cur ? 'selected' : ''}>${escHtml(v)}</option>`).join('');
    }

    async function putAttrs(id, body) {
      const res = await fetch(`${API_BASE}/by-id/${encodeURIComponent(id)}`, {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || ('HTTP ' + res.status));
      }
      return res.json();
    }

    function replaceVehicle(updated) {
      const i = allVehicles.findIndex(v => String(v.id) === String(updated.id));
      if (i >= 0) allVehicles[i] = { ...allVehicles[i], ...updated };
    }

    async function saveAttr(id, field, sel) {
      sel.classList.add('saving');
      sel.disabled = true;
      try {
        const updated = await putAttrs(id, { [field]: sel.value });
        replaceVehicle(updated);
        renderFiltered();
      } catch (e) {
        alert('저장 실패: ' + e.message);
        renderFiltered();
      }
    }

    function onRowSelect(cb) {
      if (cb.checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
      updateBulkBar();
    }

    function toggleAll(checked) {
      document.querySelectorAll('#vehicleTableBody .row-sel').forEach(cb => {
        cb.checked = checked;
        if (checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
      });
      updateBulkBar();
    }

    function updateBulkBar() {
      const visible = new Set([...document.querySelectorAll('#vehicleTableBody .row-sel')].map(cb => cb.value));
      [...selectedIds].forEach(id => { if (!visible.has(id)) selectedIds.delete(id); });
      document.getElementById('bulkCount').textContent = selectedIds.size;
      document.getElementById('bulkApplyBtn').disabled = selectedIds.size === 0;
      const all = document.getElementById('selectAll');
      if (all) all.checked = visible.size > 0 && selectedIds.size === visible.size;
    }

    async function applyBulk() {
      const op = document.getElementById('bulkOperationType').value;
      const br = document.getElementById('bulkBranch').value;
      const body = {};
      if (op !== '__keep__') body.operationType = op;
      if (br !== '__keep__') body.branch = br;
      if (!Object.keys(body).length) { alert('바꿀 운용구분 또는 소속지점을 고르세요.'); return; }
      const ids = [...selectedIds];
      const label = [op !== '__keep__' ? `운용구분 → ${op || '미지정'}` : '', br !== '__keep__' ? `소속지점 → ${br || '미지정'}` : '']
        .filter(Boolean).join(', ');
      if (!confirm(`선택한 ${ids.length}대의 ${label} 으로 바꿀까요?`)) return;

      const btn = document.getElementById('bulkApplyBtn');
      const msg = document.getElementById('bulkMsg');
      btn.disabled = true;
      let ok = 0, fail = 0;
      for (const id of ids) {
        msg.textContent = `적용 중… ${ok + fail + 1}/${ids.length}`;
        try { replaceVehicle(await putAttrs(id, body)); ok++; } catch (e) { fail++; }
      }
      msg.textContent = `완료: ${ok}대 변경` + (fail ? `, 실패 ${fail}대` : '');
      selectedIds.clear();
      renderFiltered();
    }

    function goToRegister() {
      window.location.href = 'vehicle_order.html';
    }

    // Phase 2 v5: 상세 이동은 행 PK(id) 기반 (…000 공유값 대비)
    function viewDetail(rowId) {
      window.location.href = 'vehicle_detail.html?id=' + encodeURIComponent(rowId);
    }
  </script>
  <script src="../../assets/js/excel-export.js"></script>
</body>
</html>
