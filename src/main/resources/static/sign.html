<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>계약서 서명</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #f4f6f8; color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }

  .head { text-align: center; padding: 8px 0 16px; }
  .head h1 { font-size: 19px; margin: 0 0 4px; }
  .head p { margin: 0; font-size: 13px; color: #666; }

  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #1a56db; }

  .row { display: flex; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row .k { width: 96px; flex: none; color: #777; }
  .row .v { flex: 1; font-weight: 600; word-break: break-all; }

  label.field { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%; height: 46px; padding: 0 12px; font-size: 16px;
    border: 1px solid #ccc; border-radius: 8px;
  }
  input[type=text]:focus { outline: none; border-color: #1a56db; }

  .agree { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
  .agree input { width: 22px; height: 22px; flex: none; margin-top: 1px; }

  .sign-box { border: 2px dashed #bbb; border-radius: 10px; background: #fff; position: relative; }
  .sign-box canvas { display: block; width: 100%; height: 200px; touch-action: none; border-radius: 10px; }
  .sign-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #bbb; font-size: 14px; pointer-events: none; }
  .sign-box.signed .sign-hint { display: none; }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; height: 46px; border-radius: 8px; font-size: 15px; font-weight: 600;
    border: 1px solid #ccc; background: #fff; color: #444; cursor: pointer;
  }
  .btn-primary { background: #1a56db; border-color: #1a56db; color: #fff; }
  .btn-primary:disabled { background: #b7c3d8; border-color: #b7c3d8; }
  .btn-submit { width: 100%; height: 54px; font-size: 17px; margin-top: 4px; }

  .notice { font-size: 12px; color: #888; margin-top: 12px; line-height: 1.6; }
  .state { text-align: center; padding: 60px 20px; }
  .state .icon { font-size: 44px; margin-bottom: 12px; }
  .state h2 { font-size: 18px; margin: 0 0 8px; }
  .state p { color: #666; font-size: 14px; margin: 0; }
  .err { color: #d93025; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="wrap">

  <!-- 로딩 -->
  <div id="loading" class="state">
    <div class="icon">📄</div>
    <p>계약 정보를 불러오는 중입니다...</p>
  </div>

  <!-- 오류/만료 -->
  <div id="errorView" class="state hidden">
    <div class="icon">⚠️</div>
    <h2 id="errorTitle" class="err">서명할 수 없습니다</h2>
    <p id="errorMsg"></p>
  </div>

  <!-- 완료 -->
  <div id="doneView" class="state hidden">
    <div class="icon">✅</div>
    <h2>서명이 완료되었습니다</h2>
    <p>계약서가 저장되었습니다.<br>담당자에게 문의하시면 사본을 받으실 수 있습니다.</p>
  </div>

  <!-- 본문 -->
  <div id="mainView" class="hidden">
    <div class="head">
      <h1>자동차 대여 계약서</h1>
      <p id="lessorName"></p>
    </div>

    <div class="card">
      <h2>계약 내용</h2>
      <div id="detailRows"></div>
    </div>

    <div class="card">
      <h2>서명</h2>

      <div style="margin-bottom:14px;">
        <label class="field" for="signerName">서명자 성명</label>
        <input type="text" id="signerName" placeholder="계약자 본인 성명" autocomplete="name">
      </div>

      <label class="field">아래 칸에 손가락으로 서명해 주세요</label>
      <div class="sign-box" id="signBox">
        <canvas id="pad"></canvas>
        <div class="sign-hint">여기에 서명</div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" onclick="clearPad()">지우기</button>
      </div>

      <div style="margin-top:16px;">
        <label class="agree">
          <input type="checkbox" id="agree">
          <span>위 계약 내용을 확인하였으며, 전자문서로 계약을 체결하는 데 동의합니다.</span>
        </label>
      </div>

      <button type="button" class="btn btn-primary btn-submit" id="submitBtn" onclick="submitSign()">
        서명 제출
      </button>

      <p class="notice">
        · 전자문서 및 전자거래 기본법에 따라 전자서명한 계약서는 서면 계약서와 동일한 효력을 가집니다.<br>
        · 서명 시각과 접속 정보가 함께 기록됩니다.<br>
        · 이 링크는 <span id="expireText"></span>까지만 사용할 수 있습니다.
      </p>
    </div>
  </div>

</div>

<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  let drawn = false;

  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function won(v) { return (v === null || v === undefined || v === '') ? '-' : Number(v).toLocaleString() + '원'; }

  function fail(msg) {
    hide('loading'); hide('mainView');
    $('errorMsg').textContent = msg || '알 수 없는 오류가 발생했습니다.';
    show('errorView');
  }

  // ── 계약 정보 로드 ──────────────────────────────────────
  async function load() {
    if (!token) { fail('서명 링크가 올바르지 않습니다.'); return; }
    try {
      const res = await fetch('/api/contract-sign/summary?t=' + encodeURIComponent(token));
      const data = await res.json();
      if (!res.ok) { fail(data.message || '서명할 수 없는 링크입니다.'); return; }
      render(data);
    } catch (e) {
      fail('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    }
  }

  function render(d) {
    $('lessorName').textContent = d.lessorName || '';
    const rows = [
      ['계약번호', d.contractNumber],
      ['고객명', d.customerName],
      ['차량번호', d.vehicleNo],
      ['차종', d.vehicleModel],
      ['계약구분', d.contractType],
      ['계약기간', (d.startDate || '') + (d.endDate ? ' ~ ' + d.endDate : '')],
      ['월 렌트료', won(d.monthlyRent)],
      ['보증금', won(d.deposit)],
      ['선납금', won(d.advancePayment)],
      ['청구 횟수', d.billingCount ? d.billingCount + '회' : '-']
    ];
    $('detailRows').innerHTML = rows.map(([k, v]) =>
      `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v || '-')}</div></div>`
    ).join('');

    if (d.expiresAt) {
      const t = new Date(d.expiresAt);
      $('expireText').textContent =
        `${t.getMonth() + 1}월 ${t.getDate()}일 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    }

    hide('loading');
    show('mainView');
    initPad();
  }

  // ── 서명 캔버스 ─────────────────────────────────────────
  let ctx, canvas;

  function initPad() {
    canvas = $('pad');
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';

    let drawing = false;

    function pos(ev) {
      const r = canvas.getBoundingClientRect();
      const p = ev.touches ? ev.touches[0] : ev;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(ev) {
      ev.preventDefault();
      drawing = true;
      const { x, y } = pos(ev);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }
    function move(ev) {
      if (!drawing) return;
      ev.preventDefault();
      const { x, y } = pos(ev);
      ctx.lineTo(x, y);
      ctx.stroke();
      if (!drawn) { drawn = true; $('signBox').classList.add('signed'); }
    }
    function end(ev) {
      if (!drawing) return;
      ev.preventDefault();
      drawing = false;
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end, { passive: false });
  }

  function clearPad() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawn = false;
    $('signBox').classList.remove('signed');
  }

  // ── 제출 ────────────────────────────────────────────────
  async function submitSign() {
    const name = $('signerName').value.trim();
    if (!name) { alert('서명자 성명을 입력해 주세요.'); $('signerName').focus(); return; }
    if (!drawn) { alert('서명을 입력해 주세요.'); return; }
    if (!$('agree').checked) { alert('계약 내용 확인 및 동의에 체크해 주세요.'); return; }

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = '제출 중...';

    try {
      const res = await fetch('/api/contract-sign/submit?t=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          signerName: name,
          agreed: true,
          signatureImage: canvas.toDataURL('image/png')
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '서명 처리에 실패했습니다.');

      hide('mainView');
      show('doneView');
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
      btn.textContent = '서명 제출';
    }
  }

  load();
</script>
</body>
</html>
